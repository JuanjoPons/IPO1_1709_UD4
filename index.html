sario; designación de una o varias personas trabajadoras; servicio de prevención propio; servicio de prevención ajeno."]},{"t":"p","x":["Aquestes són les modalitats recollides a l'article 10 del Reglament dels Serveis de Prevenció. Per a l'assumpció personal hi ha condicions addicionals; entre aquestes, la mida de l'empresa, l'activitat, la presència habitual i la capacitat corresponent a les funcions. La vigilància de la salut queda fora d'aquesta assumpció personal.","Estas son las modalidades recogidas en el artículo 10 del Reglamento de los Servicios de Prevención. Para la asunción personal existen condiciones adicionales; entre ellas, tamaño de empresa, actividad, presencia habitual y capacidad correspondiente a las funciones. La vigilancia de la salud queda fuera de esa asunción personal."]},{"t":"viz","v":{"type":"steps","items":[{"x":["Classificar les quatre modalitats","Clasificar las cuatro modalidades"]},{"x":["Assenyalar quina informació del cas condiciona l'elecció","Señalar qué información del caso condiciona la elección"]},{"x":["Proposar una solució viable per a la situació actual","Proponer una solución viable para la situación actual"]},{"x":["Repartir funcions entre direcció, comandaments, plantilla i organització preventiva","Repartir funciones entre dirección, mandos, plantilla y organización preventiva"]}],"title":["L'equip ha de…","El equipo debe…"]}},{"t":"p","x":["Lliurament: fitxa d'elecció i petit organigrama funcional. Puntuació: 8 punts per classificar les modalitats; 10 punts per justificar l'opció amb dades del cas; 7 punts per distribuir funcions de manera coherent.","Entrega: ficha de elección y pequeño organigrama funcional. Puntuación: 8 puntos por clasificar las modalidades; 10 puntos por justificar la opción con datos del caso; 7 puntos por distribuir funciones de manera coherente."]},{"t":"p","x":["«Per accedir a la missió següent, presenteu la vostra modalitat organitzativa i justifiqueu-la amb dues dades del cas».","«Para acceder a la siguiente misión, presentad vuestra modalidad organizativa y justificadla con dos datos del caso»."]}],"acts":["m2-cas","m2-fitxa"],"videos":[],"part":1,"time":["30 min","30 min"]},{"num":4,"kind":"activity","title":["Missió 3. «Del paper a l'acció» · 35 punts","Misión 3. «Del papel a la acción» · 35 puntos"],"nodes":[{"t":"p","x":["Cada equip converteix les quatre situacions del dossier en una planificació. Exemple de la primera fila:","Cada equipo convierte las cuatro situaciones del dossier en una planificación. Ejemplo de la primera fila:"]},{"t":"table","rows":[[["Risc o necessitat","Riesgo o necesidad"],["Mesura proposada","Medida propuesta"],["Prioritat","Prioridad"],["Responsable d'execució","Responsable de ejecución"],["Termini","Plazo"],["Recursos","Recursos"],["Comprovació","Comprobación"]],[["Cables en zona de pas.","Cables en zona de paso."],["Eliminar l'encreuament mitjançant una solució d'instal·lació adequada i controlar provisionalment la zona fins a resoldre-ho.","Eliminar el cruce mediante una solución de instalación adecuada y controlar provisionalmente la zona hasta resolverlo."],["Alta, segons el dossier.","Alta, según el dossier."],["Manteniment, amb autorització de direcció.","Mantenimiento, con autorización de dirección."],["Data concreta proposada.","Fecha concreta propuesta."],["Temps de treball i material necessari.","Tiempo de trabajo y material necesario."],["Revisió de la zona i comprovació posterior.","Revisión de la zona y comprobación posterior."]]]},{"t":"p","x":["La plantilla trasllada a l'exercici l'exigència de planificar mesures amb responsables, terminis i recursos. El seguiment permet comprovar-ne l'execució i l'eficàcia.","La plantilla traslada al ejercicio la exigencia de planificar medidas con responsables, plazos y recursos. El seguimiento permite comprobar su ejecución y eficacia."]},{"t":"p","x":["IMPORTANT","IMPORTANTE"]},{"t":"p","x":["Targeta d'imprevist (a meitat de la missió): «L'empresa canvia la distribució de diversos llocs i preveu incorporar dues persones. Reviseu quines decisions del vostre expedient s'han d'actualitzar». L'equip ha d'identificar quines actuacions requereixen revisió i justificar-ho, sense fer una avaluació tècnica per a la qual no té informació.","Tarjeta de imprevisto (a mitad de la misión): «La empresa cambia la distribución de varios puestos y prevé incorporar a dos personas. Revisad qué decisiones de vuestro expediente deben actualizarse». El equipo debe identificar qué actuaciones requieren revisión y justificarlo, sin realizar una evaluación técnica para la que no dispone de información."]},{"t":"p","x":["Regla del joc: si falten recursos per a una mesura necessària, l'equip n'ha de sol·licitar l'assignació a direcció i proposar com controlar la situació mentre es resol. No es premia deixar riscos sense atendre per estalviar punts.","Regla del juego: si faltan recursos para una medida necesaria, el equipo debe solicitar su asignación a dirección y proponer cómo controlar la situación mientras se resuelve. No se premia dejar riesgos sin atender para ahorrar puntos."]},{"t":"p","x":["Puntuació: 12 punts per proposar mesures coherents; 15 punts per concretar responsables, terminis i recursos; 8 punts per preveure seguiment i respondre al canvi.","Puntuación: 12 puntos por proponer medidas coherentes; 15 puntos por concretar responsables, plazos y recursos; 8 puntos por prever seguimiento y responder al cambio."]},{"t":"links","title":null,"items":[{"i":"checklist","x":["Mesures/activitats per eliminar o reduir els riscos (INSST, PDF)","Medidas/actividades para eliminar o reducir los riesgos (INSST, PDF)"],"d":["La planificació ha d'incloure terminis, responsables i recursos humans i materials.","La planificación debe incluir plazos, responsables y recursos humanos y materiales."],"url":"https://www.insst.es/documents/94886/454629/4.+Medidas-actividades+para+eliminar+o+reducir+los+riesgos.pdf/9c0d3210-a8ed-4a2a-979a-bbf20db0e808"}]}],"acts":["m3-ordre","m3-verificable","m3-planificacio"],"videos":[],"part":2,"time":["30 min","30 min"]},{"num":5,"kind":"activity","title":["Repte final. «Defenseu el vostre expedient» · 20 punts","Reto final. «Defended vuestro expediente» · 20 puntos"],"nodes":[{"t":"p","x":["Cada equip intercanvia el seu expedient amb un altre, que actua com a auditor didàctic i comprova:","Cada equipo intercambia su expediente con otro, que actúa como auditor didáctico y comprueba:"]},{"t":"viz","v":{"type":"cards","items":[{"i":"layers","s":"info","x":["Es distingeix entre pla, avaluació i planificació?","¿Se distingue entre plan, evaluación y planificación?"]},{"i":"building","s":"info","x":["La modalitat organitzativa està justificada?","¿La modalidad organizativa está justificada?"]},{"i":"user","s":"must","x":["Cada mesura té responsable, termini i recursos?","¿Cada medida tiene responsable, plazo y recursos?"]},{"i":"check","s":"safe","x":["S'explica com comprovar-ne l'execució i l'eficàcia?","¿Se explica cómo comprobar su ejecución y eficacia?"]},{"i":"history","s":"warn","x":["S'han detectat decisions que s'han de revisar?","¿Se han detectado decisiones que deben revisarse?"]}],"title":["Llista de comprovació de l'auditoria","Lista de comprobación de la auditoría"]}},{"t":"p","x":["L'equip disposa de dos minuts per defensar una decisió i corregir una mancança assenyalada. Preguntes útils del docent: «Heu escrit “ho farà l'empresa”. Qui ho ha d'executar concretament?» · «Com sabreu que la mesura funciona i no només que s'ha comprat material?» · «Què aporta el pla preventiu que no aporta una llista de riscos?»","El equipo dispone de dos minutos para defender una decisión y corregir una carencia señalada. Preguntas útiles del docente: «Habéis escrito “lo hará la empresa”. ¿Quién debe ejecutarlo concretamente?» · «¿Cómo sabréis que la medida funciona y no solo que se ha comprado material?» · «¿Qué aporta el plan preventivo que no aporta una lista de riesgos?»"]}],"acts":["m4-auditoria"],"videos":[],"part":2,"time":["15 min","15 min"]},{"num":6,"kind":"summary","title":["Tancament individual","Cierre individual"],"nodes":[{"t":"p","x":["La missió busca que passis de «l'empresa ha de prevenir» a una explicació operativa: la prevenció necessita una organització definida i actuacions concretes, dotades de responsables, recursos, terminis i seguiment. Aquesta és precisament la connexió entre el pla de prevenció i la planificació de l'activitat preventiva establerta a la normativa.","La actividad busca que el alumnado pase de «la empresa debe prevenir» a una explicación operativa: la prevención necesita una organización definida y actuaciones concretas, dotadas de responsables, recursos, plazos y seguimiento. Esa es precisamente la conexión entre el plan de prevención y la planificación de la actividad preventiva establecida en la normativa."]}],"acts":["m5-tancament","m6-protocol"],"videos":[],"part":2,"time":["10 min","10 min"]}],"final":[],"acts":[{"id":"A1UD4","code":"A1UD4","type":"teacher","origin":"manual","time":["2 sessions de 55 min","2 sesiones de 55 min"],"kind":["Simulació empresarial gamificada","Simulación empresarial gamificada"],"group":["Equips de dues persones","Equipos de dos personas"],"mode":["Narrativa, missions, rols, punts d'experiència, insígnies i retroalimentació (Genially com a centre d'operacions)","Narrativa, misiones, roles, puntos de experiencia, insignias y retroalimentación (Genially como centro de operaciones)"],"ra":"RA2","ce":"e, f, g (d)","title":["Missió: empresa segura","Misión: empresa segura"],"statement":[{"t":"p","x":["L'alumnat ha d'organitzar la prevenció d'una empresa fictícia i transformar una avaluació de riscos ja facilitada en una planificació preventiva. El repte no consisteix només a identificar perills, sinó a decidir qui fa què, amb quins recursos, en quin termini i com es comprovarà que les mesures funcionen.","El alumnado debe organizar la prevención de una empresa ficticia y transformar una evaluación de riesgos ya facilitada en una planificación preventiva. El reto no consiste solo en identificar peligros, sino en decidir quién hace qué, con qué recursos, en qué plazo y cómo se comprobará que las medidas funcionan."]},{"t":"h3","x":["Missatge inicial a l'alumnat","Mensaje inicial al alumnado"]},{"t":"p","x":["«L'empresa Tramuntana Serveis necessita reorganitzar la seva prevenció. Té documents dispersos, responsabilitats poc clares i mesures pendents. El vostre equip ha de superar tres missions i una auditoria final per aconseguir el segell didàctic “Empresa organitzada per prevenir”. No n'hi ha prou de proposar bones idees: haureu de demostrar qui les executarà, quan i amb quins mitjans».","«La empresa Tramuntana Serveis necesita reorganizar su prevención. Tiene documentos dispersos, responsabilidades poco claras y medidas pendientes. Vuestro equipo debe superar tres misiones y una auditoría final para conseguir el sello didáctico “Empresa organizada para prevenir”. No basta con proponer buenas ideas: tendréis que demostrar quién las ejecutará, cuándo y con qué medios»."]},{"t":"h3","x":["Dossier de l'empresa fictícia","Dossier de la empresa ficticia"]},{"t":"list","k":"ul","l":1,"items":[["Activitat: serveis administratius i atenció al públic.","Actividad: servicios administrativos y atención al público."],["Plantilla: 18 persones.","Plantilla: 18 personas."],["Centres de treball: un.","Centros de trabajo: uno."],["L'empresària treballa habitualment al centre.","La empresaria trabaja habitualmente en el centro."],["Actualment no disposa de capacitació preventiva.","No dispone actualmente de capacitación preventiva."],["Cap persona de la plantilla té assignades funcions preventives ni capacitació acreditada.","Ninguna persona de la plantilla tiene asignadas funciones preventivas ni capacitación acreditada."],["L'activitat no està inclosa a l'annex I del Reglament dels Serveis de Prevenció.","La actividad no está incluida en el anexo I del Reglamento de los Servicios de Prevención."],["No hi ha un repartiment clar de responsabilitats preventives.","No existe un reparto claro de responsabilidades preventivas."]],"start":1},{"t":"p","x":["El dossier incorpora aquesta avaluació de riscos simplificada, preparada prèviament pel docent:","El dossier incorpora esta evaluación de riesgos simplificada, preparada previamente por el docente:"]},{"t":"table","rows":[[["Situació detectada","Situación detectada"],["Prioritat indicada en el cas","Prioridad indicada en el caso"]],[["Cables que travessen una zona de pas.","Cables que atraviesan una zona de paso."],["Alta.","Alta."]],[["Material pesant emmagatzemat de manera inestable.","Material pesado almacenado de forma inestable."],["Alta.","Alta."]],[["Llocs amb pantalles que necessiten ajustos ergonòmics.","Puestos con pantallas que necesitan ajustes ergonómicos."],["Mitjana.","Media."]],[["Incorporació de personal sense un procediment organitzat d'informació preventiva.","Incorporación de personal sin un procedimiento organizado de información preventiva."],["Actuació abans de la pròxima incorporació.","Actuación antes de la próxima incorporación."]]]},{"t":"p","x":["Les prioritats són dades didàctiques del supòsit, no una valoració tècnica transferible a qualsevol empresa. L'expedient és un recurs d'aprenentatge: no substitueix una avaluació de riscos ni un pla de prevenció elaborats per a una empresa real.","Las prioridades son datos didácticos del supuesto, no una valoración técnica transferible a cualquier empresa. El expediente es un recurso de aprendizaje: no sustituye una evaluación de riesgos ni un plan de prevención elaborados para una empresa real."]},{"t":"h3","x":["Rols de l'equip (canvien a la segona sessió)","Roles del equipo (cambian en la segunda sesión)"]},{"t":"viz","v":{"type":"cards","items":[{"i":"clock","s":"info","x":["Coordinació","Coordinación"],"d":["Organitza el treball i controla els temps.","Organiza el trabajo y controla los tiempos."]},{"i":"book","s":"info","x":["Consulta normativa","Consulta normativa"],"d":["Localitza la informació a les fitxes.","Localiza la información en las fichas."]},{"i":"edit","s":"info","x":["Planificació","Planificación"],"d":["Registra els acords i completa les plantilles.","Registra los acuerdos y completa las plantillas."]},{"i":"check","s":"safe","x":["Verificació","Verificación"],"d":["Comprova que les decisions estan justificades.","Comprueba que las decisiones están justificadas."]}],"note":["Són funcions dins del joc, no designacions legals de personal preventiu.","Son funciones dentro del juego, no designaciones legales de personal preventivo."]}},{"t":"h3","x":["Sistema de gamificació","Sistema de gamificación"]},{"t":"p","x":["El joc suma 100 punts, però el progrés depèn de la qualitat de les decisions, no d'acabar abans.","El juego suma 100 puntos, pero el progreso depende de la calidad de las decisiones, no de terminar antes."]},{"t":"table","rows":[[["Element","Elemento"],["Aplicació","Aplicación"]],[["Panell de progrés","Panel de progreso"],["Cada equip avança per quatre estacions: comprendre, organitzar, planificar i verificar.","Cada equipo avanza por cuatro estaciones: comprender, organizar, planificar y verificar."]],[["Insígnia «Organització coherent»","Insignia «Organización coherente»"],["Modalitat justificada i funcions clares.","Modalidad justificada y funciones claras."]],[["Insígnia «Planificació completa»","Insignia «Planificación completa»"],["Totes les actuacions tenen responsable, termini, recursos i comprovació.","Todas las actuaciones cuentan con responsable, plazo, recursos y comprobación."]],[["Insígnia «Millora preventiva»","Insignia «Mejora preventiva»"],["L'equip detecta i corregeix una decisió insuficient.","El equipo detecta y corrige una decisión insuficiente."]],[["Retroalimentació","Retroalimentación"],["El docent retorna les fitxes amb preguntes i permet revisar-les.","El docente devuelve las fichas con preguntas y permite revisarlas."]],[["Meta cooperativa","Meta cooperativa"],["La classe completa la missió quan tots els equips assoleixen els requisits essencials, encara que necessitin una revisió.","La clase completa la misión cuando todos los equipos alcanzan los requisitos esenciales, aunque necesiten una revisión."]]]},{"t":"p","x":["Per obtenir el segell didàctic calen 70 punts i dues condicions obligatòries: una modalitat organitzativa justificada i una planificació sense mesures prioritàries que no tinguin responsable o termini. La puntuació per si sola no compensa aquestes mancances.","Para obtener el sello didáctico se requieren 70 puntos y dos condiciones obligatorias: una modalidad organizativa justificada y una planificación sin medidas prioritarias carentes de responsable o plazo. La puntuación por sí sola no compensa esas carencias."]},{"t":"p","x":["Producte: un expedient preventiu simplificat (modalitat organitzativa, repartiment de funcions, planificació de mesures i justificació final). Es pot fer íntegrament en paper.","Producto: un expediente preventivo simplificado (modalidad organizativa, reparto de funciones, planificación de medidas y justificación final). Puede realizarse íntegramente en papel."]}],"criteria":[{"ra":"RA2","title":["Adquireix les competències necessàries per a l'exercici de les funcions de nivell bàsic en Prevenció de Riscos Laborals.","Adquiere las competencias necesarias para el desempeño de las funciones de nivel básico en Prevención de Riesgos Laborales."],"ce":[["e",["S'han determinat els drets i deures principals en matèria de PRL.","Se han determinado los derechos y deberes principales en materia de PRL."]],["f",["S'han classificat les formes de gestió de la prevenció…","Se han clasificado las formas de gestión de la prevención…"]],["g",["S'ha valorat la importància d'un pla preventiu…","Se ha valorado la importancia de un plan preventivo…"]],["d",["S'han analitzat els protocols d'actuació en cas d'emergència.","Se han analizado los protocolos de actuación en caso de emergencia."]]]}],"embed":{"t":"embed","title":["Missió: empresa segura (Genially)","Misión: empresa segura (Genially)"],"src":"https://view.genially.com/6afce2006347196d4e297200","url":"https://view.genially.com/6afce2006347196d4e297200","ratio":"16:9","h":null},"fields":[["Equip (noms) i rol de cada persona a la sessió 1 i a la sessió 2","Equipo (nombres) y rol de cada persona en la sesión 1 y en la sesión 2"],["Punts obtinguts en cada missió i insígnies aconseguides","Puntos obtenidos en cada misión e insignias conseguidas"],["Enllaç o foto de l'expedient preventiu de l'equip","Enlace o foto del expediente preventivo del equipo"]],"rubric":["Rúbrica (separada dels punts del joc): Drets, deures i responsabilitats — e) 25 %: distingeix obligacions empresarials i col·laboració de la plantilla; assigna funcions sense confondre-les. Modalitats organitzatives — f) 30 %: classifica les modalitats i justifica una opció amb les condicions del cas. Valor del pla i concreció de la planificació — g) 35 %: relaciona organització i actuació; concreta mesures i explica la utilitat de responsables, recursos, terminis i seguiment. Justificació individual — e), f), g) 10 %: explica les decisions amb les seves paraules i reconeix què ha corregit. Nivells: complet i justificat; adequat amb omissions menors; parcial; insuficient.","Rúbrica (separada de los puntos del juego): Derechos, deberes y responsabilidades — e) 25 %: distingue obligaciones empresariales y colaboración de la plantilla; asigna funciones sin confundirlas. Modalidades organizativas — f) 30 %: clasifica las modalidades y justifica una opción utilizando las condiciones del caso. Valor del plan y concreción de la planificación — g) 35 %: relaciona organización y actuación; concreta medidas y explica la utilidad de responsables, recursos, plazos y seguimiento. Justificación individual — e), f), g) 10 %: explica las decisiones con sus propias palabras y reconoce qué ha corregido. Niveles: completo y justificado; adecuado con omisiones menores; parcial; insuficiente."],"block":"M"},{"id":"m-diagnostic","type":"teacher","origin":"manual","time":["Inici de la sessió 1","Inicio de la sesión 1"],"group":["Individual","Individual"],"ce":"f, g","title":["Diagnòstic inicial (sense qualificació)","Diagnóstico inicial (sin calificación)"],"instr":["Respon en una o dues línies. Serveix per detectar idees prèvies; no compta per a la nota.","Responde en una o dos líneas. Sirve para detectar ideas previas; no cuenta para la nota."],"fields":[["Són el mateix el pla de prevenció i la planificació preventiva?","¿Son lo mismo el plan de prevención y la planificación preventiva?"],["Quina informació necessites per triar com organitzar la prevenció?","¿Qué información necesitas para elegir cómo organizar la prevención?"],["Què li falta a una mesura que únicament diu «millorar la seguretat»?","¿Qué le falta a una medida que únicamente dice «mejorar la seguridad»?"]],"block":"M","ra":"RA2"},{"id":"m1-conceptes","type":"match","time":["3 min","3 min"],"ce":"g","origin":"manual","title":["Comprova el teu esquema","Comprueba tu esquema"],"pairs":[{"a":["Pla de prevenció","Plan de prevención"],"b":["Defineix l'organització i integració de la prevenció","Define la organización e integración de la prevención"],"exp":["Missió 1.","Misión 1."]},{"a":["Avaluació de riscos","Evaluación de riesgos"],"b":["Identifica i valora els riscos","Identifica y valora los riesgos"],"exp":["Missió 1.","Misión 1."]},{"a":["Planificació de l'activitat preventiva","Planificación de la actividad preventiva"],"b":["Concreta terminis, responsables i recursos de cada actuació","Concreta plazos, responsables y recursos de cada actuación"],"exp":["Missió 1.","Misión 1."]},{"a":["Seguiment","Seguimiento"],"b":["Comprova l'execució i l'eficàcia de les mesures","Comprueba la ejecución y la eficacia de las medidas"],"exp":["Missió 3: el seguiment permet comprovar la seva execució i eficàcia.","Misión 3: el seguimiento permite comprobar su ejecución y eficacia."]}],"block":"M","ra":"RA2"},{"id":"m1-esquema","type":"teacher","origin":"manual","time":["12 min","12 min"],"group":["Equip","Equipo"],"ce":"g","title":["Lliurament de la missió 1","Entrega de la misión 1"],"fields":[["Esquema: com es relacionen els sis conceptes","Esquema: cómo se relacionan los seis conceptos"],["Per què no n'hi ha prou amb «tenir documents»?","¿Por qué no basta con «tener documentos»?"]],"block":"M","ra":"RA2"},{"id":"m2-cas","type":"tf","time":["5 min","5 min"],"ce":"f","origin":"manual","title":["Què diu el dossier de Tramuntana Serveis?","¿Qué dice el dossier de Tramuntana Serveis?"],"questions":[{"q":["Tenir 18 persones obliga sempre a contractar un servei de prevenció aliè.","Tener 18 personas obliga siempre a contratar un servicio de prevención ajeno."],"ans":false,"exp":["Amb fins a 25 persones i un únic centre, l'assumpció personal pot ser possible si concorren els altres requisits legals.","Con hasta 25 personas y un único centro, la asunción personal puede ser posible si concurren los demás requisitos legales."]},{"q":["Ara mateix l'empresària no pot assumir personalment la prevenció.","Ahora mismo la empresaria no puede asumir personalmente la prevención."],"ans":true,"exp":["Treballa al centre, però no té la capacitació necessària.","Trabaja en el centro, pero carece de la capacitación necesaria."]},{"q":["Ara mateix es pot designar una persona de la plantilla perquè gestioni la prevenció.","Ahora mismo se puede designar a una persona de la plantilla para que gestione la prevención."],"ans":false,"exp":["Ningú de la plantilla té capacitació acreditada; els designats han de tenir capacitat i formació suficients.","Nadie de la plantilla tiene capacitación acreditada; los designados deben tener capacidad y formación suficientes."]},{"q":["L'empresa està obligada a crear un servei de prevenció propi.","La empresa está obligada a crear un servicio de prevención propio."],"ans":false,"exp":["Té menys de 250 persones i l'activitat no és de l'annex I.","Tiene menos de 250 personas y la actividad no es del anexo I."]}],"block":"M","ra":"RA2"},{"id":"m2-fitxa","type":"teacher","origin":"manual","time":["25 min","25 min"],"group":["Equip","Equipo"],"ce":"e, f","title":["Fitxa d'elecció i organigrama funcional","Ficha de elección y organigrama funcional"],"fields":[["Modalitat triada","Modalidad elegida"],["Dades del cas que justifiquen l'elecció (almenys dues)","Datos del caso que justifican la elección (al menos dos)"]],"grid":{"cols":[["Qui","Quién"],["Funcions preventives","Funciones preventivas"]],"rows":4},"solution":[["Resposta orientativa per al docent: concertar l'activitat amb un servei de prevenció aliè és una opció justificada amb les dades actuals. L'empresària no la pot assumir personalment en aquest moment perquè no té la capacitació necessària. No s'ha d'ensenyar que «tenir 18 persones obliga sempre a contractar un servei aliè»: amb fins a 25 persones i un únic centre, l'assumpció personal pot ser possible si concorren els altres requisits legals.","Respuesta orientativa para el docente: concertar la actividad con un servicio de prevención ajeno es una opción justificada con los datos actuales. La empresaria no puede asumirla personalmente en ese momento porque carece de la capacitación necesaria. No debe enseñarse que «tener 18 personas obliga siempre a contratar un servicio ajeno»: con hasta 25 personas y un único centro, la asunción personal puede ser posible si concurren los demás requisitos legales."]],"block":"M","ra":"RA2"},{"id":"m3-ordre","type":"order","time":["3 min","3 min"],"ce":"g","origin":"manual","title":["Ordena les columnes de la planificació","Ordena las columnas de la planificación"],"items":[["Situació detectada","Situación detectada"],["Mesura","Medida"],["Prioritat","Prioridad"],["Responsable","Responsable"],["Termini","Plazo"],["Recursos","Recursos"],["Comprovació","Comprobación"],["Estat","Estado"]],"exp":["Ordre de la pestanya «Planificació» del full de càlcul de l'equip.","Orden de la pestaña «Planificación» de la hoja de cálculo del equipo."],"block":"M","ra":"RA2"},{"id":"m3-verificable","type":"classify","time":["4 min","4 min"],"ce":"g","origin":"complementaria","title":["És una actuació verificable?","¿Es una actuación verificable?"],"cats":[["Concreta i verificable","Concreta y verificable"],["Li falta concreció","Le falta concreción"]],"items":[{"x":["Responsable: «ho farà l'empresa».","Responsable: «lo hará la empresa»."],"c":1,"exp":["Cal dir qui ho ha d'executar concretament.","Hay que decir quién debe ejecutarlo concretamente."]},{"x":["Termini: «quan sigui possible».","Plazo: «cuando sea posible»."],"c":1,"exp":["Cal una data concreta.","Hace falta una fecha concreta."]},{"x":["Mesura: «millorar l'emmagatzematge».","Medida: «mejorar el almacenamiento»."],"c":1,"exp":["Una mesura ha de dir què es farà exactament.","Una medida debe decir qué se hará exactamente."]},{"x":["Responsable: manteniment, amb autorització de direcció.","Responsable: mantenimiento, con autorización de dirección."],"c":0,"exp":["Exemple de la missió 3.","Ejemplo de la misión 3."]},{"x":["Comprovació: revisió de la zona i comprovació posterior.","Comprobación: revisión de la zona y comprobación posterior."],"c":0,"exp":["Permet saber si la mesura funciona.","Permite saber si la medida funciona."]},{"x":["Comprovació: «s'ha comprat el material».","Comprobación: «se ha comprado el material»."],"c":1,"exp":["Comprar material no demostra que la mesura funcioni.","Comprar material no demuestra que la medida funcione."]}],"block":"M","ra":"RA2"},{"id":"m3-planificacio","type":"teacher","origin":"manual","time":["23 min","23 min"],"group":["Equip","Equipo"],"ce":"e, g","title":["Planificació preventiva de Tramuntana Serveis","Planificación preventiva de Tramuntana Serveis"],"grid":{"cols":[["Risc o necessitat","Riesgo o necesidad"],["Mesura proposada","Medida propuesta"],["Prioritat","Prioridad"],["Responsable d'execució","Responsable de ejecución"],["Termini","Plazo"],["Recursos","Recursos"],["Comprovació","Comprobación"]],"rows":4},"fields":[["Imprevist: quines decisions s'han d'actualitzar i per què","Imprevisto: qué decisiones deben actualizarse y por qué"]],"block":"M","ra":"RA2"},{"id":"m4-auditoria","type":"teacher","origin":"manual","time":["15 min","15 min"],"group":["Equip auditor","Equipo auditor"],"ce":"f, g","title":["Informe d'auditoria i correcció","Informe de auditoría y corrección"],"fields":[["Expedient auditat (equip) i mancança principal detectada","Expediente auditado (equipo) y carencia principal detectada"],["Decisió defensada pel vostre equip i correcció feta","Decisión defendida por vuestro equipo y corrección realizada"]],"block":"M","ra":"RA2"},{"id":"m5-tancament","type":"teacher","origin":"manual","time":["10 min","10 min"],"group":["Individual","Individual"],"ce":"e, f, g","title":["Tancament individual de la missió","Cierre individual de la misión"],"instr":["Aquest tancament permet comprovar l'aprenentatge individual, més enllà del resultat del grup.","Este cierre permite comprobar el aprendizaje individual, más allá del resultado del grupo."],"fields":[["Quina diferència hi ha entre el pla de prevenció i la planificació preventiva?","¿Qué diferencia hay entre el plan de prevención y la planificación preventiva?"],["Per què heu triat aquesta modalitat organitzativa?","¿Por qué habéis elegido esa modalidad organizativa?"],["Què pot fallar si una mesura no té responsable o termini?","¿Qué puede fallar si una medida no tiene responsable o plazo?"],["Explica una decisió que el teu equip hagi millorat després de rebre retroalimentació.","Explica una decisión que vuestro equipo haya mejorado después de recibir retroalimentación."]],"block":"M","ra":"RA2"},{"id":"m6-protocol","type":"teacher","origin":"manual","time":["Opcional · 15 min (fora de les dues sessions)","Opcional · 15 min (fuera de las dos sesiones)"],"group":["Equip","Equipo"],"ce":"d","title":["Ampliació opcional (criteri d): analitza un protocol d'emergència","Ampliación opcional (criterio d): analiza un protocolo de emergencia"],"instr":["El docent entrega un protocol fictici en què no s'identifica qui dona l'alarma, qui avisa els serveis externs ni com es comprova l'evacuació. Analitzeu-ne les mancances i proposeu correccions. Només així es recull evidència del criteri d): no n'hi ha prou de mencionar una emergència.","El docente entrega un protocolo ficticio en el que no se identifica quién da la alarma, quién avisa a los servicios externos ni cómo se comprueba la evacuación. Analizad las carencias y proponed correcciones. Solo así se recoge evidencia del criterio d): no basta con mencionar una emergencia."],"fields":[["Mancances detectades","Carencias detectadas"],["Correccions proposades (qui, què i com es comprova)","Correcciones propuestas (quién, qué y cómo se comprueba)"]],"block":"M","ra":"RA2"}],"notes":[["Fitxa «A1UD4 Misión: empresa segura» (en castellà), traduïda al català. Els punts del joc i la rúbrica són els de la fitxa.","Ficha «A1UD4 Misión: empresa segura», copiada literalmente; traducida al catalán. Los puntos del juego y la rúbrica son los de la ficha."]],"cover":{"signs":[["info","building",["Tramuntana Serveis: 18 persones, un centre","Tramuntana Serveis: 18 personas, un centro"]],["must","group",["Equips de dues persones amb rols","Equipos de dos personas con roles"]],["info","target",["3 missions i una auditoria: 100 punts","3 misiones y una auditoría: 100 puntos"]],["safe","star",["Segell «Empresa organitzada per prevenir»","Sello «Empresa organizada para prevenir»"]]],"lead":["No n'hi ha prou de proposar bones idees: haureu de demostrar qui les executarà, quan i amb quins mitjans.","No basta con proponer buenas ideas: tendréis que demostrar quién las ejecutará, cuándo y con qué medios."]},"art":"checklist","parts":[{"title":["Sessió 1 · Organitzar la prevenció","Sesión 1 · Organizar la prevención"],"time":["55 min","55 min"],"min":55},{"title":["Sessió 2 · Convertir les decisions en actuacions","Sesión 2 · Convertir las decisiones en actuaciones"],"time":["55 min","55 min"],"min":55}],"tabLabel":["Missió A1UD4","Misión A1UD4"]},{"id":"B2","ud":"UD4","title":["2.2 a 2.6. Emergències, EPI, formació i participació","2.2 a 2.6. Emergencias, EPI, formación y participación"],"meta":{"ra_fp":"RA2","ce_txt":"RA2 d, e","pes":["Proposta: 2 sessions de 55 min","Propuesta: 2 sesiones de 55 min"]},"sections":[{"num":1,"kind":"theory","title":["2.2. Elaborar un pla d'emergència: classificació i actuacions","2.2. Elaborar un plan de emergencia: clasificación y actuaciones"],"nodes":[{"t":"p","x":["En el pla d'emergència s'analitzen les possibles situacions d'emergència (un incendi, una explosió, etc) i les mesures necessàries en primers auxilis, lluita contra incendis i mesures d'evacuació. Per a això es designa al personal i equips d'emergència encarregats de prendre aquestes mesures d'emergència. A més, el pla ha d'establir la coordinació amb serveis externs: urgències, bombers, protecció civil.","En el plan de emergencia se analizan las posibles situaciones de emergencia (un incendio, una explosión, etc.) y las medidas necesarias en primeros auxilios, lucha contra incendios y medidas de evacuación. Para ello se designa al personal y equipos de emergencia encargados de tomar estas medidas de emergencia. Además, el plan debe establecer la coordinación con servicios externos: urgencias, bomberos, protección civil."]},{"t":"viz","v":{"type":"chain","title":["Parts del pla d'emergències","Partes del plan de emergencias"],"items":[{"i":"alert","s":"fire","x":["Possibles emergències en l'empresa","Posibles emergencias en la empresa"]},{"i":"checklist","s":"must","x":["Actuacions a dur a terme","Actuaciones a llevar a cabo"]},{"i":"group","s":"safe","x":["Equips d'emergència que han d'intervenir","Equipos de emergencia que deben intervenir"]}]}},{"t":"h3","x":["A) Classificació de les emergències","A) Clasificación de las emergencias"]},{"t":"p","x":["Les empreses han d'establir quines són les possibles situacions d'emergència i classificar-les atenent la seva gravetat en:","Las empresas deben establecer cuáles son las posibles situaciones de emergencia y clasificarlas atendiendo a su gravedad en:"]},{"t":"viz","v":{"type":"pyramid","items":[{"i":"exit","x":["Emergència general","Emergencia general"],"d":["És un accident que necessita de tots els mitjans humans i materials, fins i tot de mitjans exteriors. Comporta l'evacuació de l'edifici.","Es un accidente que necesita todos los medios humanos y materiales, incluso medios exteriores. Conlleva la evacuación del edificio."]},{"i":"building","x":["Emergència parcial","Emergencia parcial"],"d":["És un accident que per a ser controlat precisa dels mitjans humans i els equips de tot l'edifici, però els efectes del qual es limiten a una sola àrea.","Es un accidente que para ser controlado precisa de los medios humanos y los equipos de todo el edificio, pero cuyos efectos se limitan a una sola área."]},{"i":"extinguisher","x":["Conat d'emergència","Conato de emergencia"],"d":["És un accident que pot ser controlat de manera senzilla pel personal de l'empresa, com l'incendi d'una paperera, que es pot apagar amb ajuda d'un extintor.","Es un accidente que puede ser controlado de manera sencilla por el personal de la empresa, como el incendio de una papelera, que se puede apagar con ayuda de un extintor."]}],"axis":[["més greu","más grave"],["menys greu","menos grave"]]}},{"t":"h3","x":["B) Actuacions en cas d'emergència","B) Actuaciones en caso de emergencia"]},{"t":"viz","v":{"type":"steps","items":[{"i":"eye","s":"info","x":["Detecció i alerta","Detección y alerta"],"d":["El sistema de detecció i alerta ha de comptar amb detecció automàtica enfront d'incendis, fuites, etc, i detecció humana per als altres casos, designant a persones encarregades per a això.","El sistema de detección y alerta debe contar con detección automática frente a incendios, fugas, etc., y detección humana para los otros casos, designando a personas encargadas para ello."]},{"i":"bell","s":"fire","x":["Mecanismes d'alarma","Mecanismos de alarma"],"d":["L'alarma és l'avís d'emergència a totes les persones del centre, així com el senyal d'evacuació de les zones en perill. Li correspon al cap d'emergències donar l'alarma, així com comunicar l'avís d'emergències a les ajudes externes: protecció civil, bombers, etc.","La alarma es el aviso de emergencia a todas las personas del centro, así como la señal de evacuación de las zonas en peligro. Corresponde al jefe de emergencias dar la alarma, así como comunicar el aviso de emergencias a las ayudas externas: protección civil, bomberos, etc."]},{"i":"group","s":"must","x":["Mecanismes de resposta","Mecanismos de respuesta"],"d":["Han de seguir-se les instruccions donades pels equips d'alarma i evacuació (sota la direcció del cap d'emergències). Els equips de primers auxilis atenen els ferits i ajuden en l'evacuació. Els equips de primera intervenció s'encarreguen de controlar l'emergència i col·laboren amb les ajudes exteriors si ho sol·liciten.","Deben seguirse las instrucciones dadas por los equipos de alarma y evacuación (bajo la dirección del jefe de emergencias). Los equipos de primeros auxilios atienden a los heridos y ayudan en la evacuación. Los equipos de primera intervención se encargan de controlar la emergencia y colaboran con las ayudas exteriores si lo solicitan."]},{"i":"exit","s":"safe","x":["Evacuació","Evacuación"],"d":["S'indiquen les instruccions per a l'evacuació, punts de reunió, el recorregut, i les prohibicions durant aquesta: no utilitzar ascensors, no intentar tornar, no córrer, no perdre la calma. En cas d'incendi es requereixen a més les següents actuacions: no obrir una porta calenta; tancar portes però no amb clau; si hi ha fum, baixar el cap o caminar de quatre grapes amb un mocador humit sobre el nas i boca; si es corprengui la roba, no córrer, sinó rodar pel sòl per a apagar la flama.","Se indican las instrucciones para la evacuación, puntos de reunión, el recorrido y las prohibiciones durante esta: no utilizar ascensores, no intentar volver, no correr, no perder la calma. En caso de incendio se requieren además las siguientes actuaciones: no abrir una puerta caliente; cerrar puertas pero no con llave; si hay humo, bajar la cabeza o caminar a gatas con un pañuelo húmedo sobre la nariz y la boca; si se prende la ropa, no correr, sino rodar por el suelo para apagar la llama."]},{"i":"kit","s":"safe","x":["Prestació de primeres ajudes","Prestación de primeros auxilios"],"d":["Els corresponen als treballadors que formen els equips d'emergència prestar les primeres ajudes fins que arribin els suports externs i es facin càrrec de la situació.","Corresponde a los trabajadores que forman los equipos de emergencia prestar los primeros auxilios hasta que lleguen los apoyos externos y se hagan cargo de la situación."]}]}},{"t":"viz","v":{"type":"scene","scene":"fire","title":["Troba què falla en aquesta emergència","Encuentra qué falla en esta emergencia"],"spots":[{"px":300,"py":150,"t":["Conat d'incendi: si és senzill, el pot controlar el personal amb un extintor.","Conato de incendio: si es sencillo, lo puede controlar el personal con un extintor."]},{"px":120,"py":130,"t":["La sortida no pot estar bloquejada: l'evacuació necessita un recorregut lliure fins al punt de reunió.","La salida no puede estar bloqueada: la evacuación necesita un recorrido libre hasta el punto de reunión."]}],"note":["Escena il·lustrativa (no és al manual).","Escena ilustrativa (no está en el manual)."]}}],"acts":["b2-emerg","b2-ex3"],"videos":[],"part":1,"time":["20 min","20 min"]},{"num":2,"kind":"theory","title":["2.2 C) Equips d'emergència","2.2 C) Equipos de emergencia"],"nodes":[{"t":"p","x":["Es designen entre els treballadors a les persones que formaran part dels diferents equips d'emergència, els quals han d'estar formats i entrenats per a assumir les seves funcions en cas de presentar-se una situació d'emergència, fins que arribi l'ajuda externa. Per a això cal la formació contínua, la informació a través de cartells a tot el personal i la realització periòdica de simulacres (almenys un a l'any), de manera que es mantinguin els recursos humans actualitzats.","Se designan entre los trabajadores las personas que formarán parte de los diferentes equipos de emergencia, que deben estar formados y entrenados para asumir sus funciones en caso de presentarse una situación de emergencia, hasta que llegue la ayuda externa. Para ello es necesaria la formación continua, la información a través de carteles a todo el personal y la realización periódica de simulacros (al menos uno al año), de manera que se mantengan los recursos humanos actualizados."]},{"t":"viz","v":{"type":"cards","items":[{"i":"boss","s":"fire","x":["Cap d'emergències","Jefe de emergencias"],"d":["És el coordinador dels equips d'emergència. S'encarrega de donar l'alarma i coordinar-se amb els serveis externs.","Es el coordinador de los equipos de emergencia. Se encarga de dar la alarma y coordinarse con los servicios externos."]},{"i":"flag","s":"fire","x":["Cap d'intervenció","Jefe de intervención"],"d":["Acudeix al lloc de l'emergència per a dirigir els equips d'emergències.","Acude al lugar de la emergencia para dirigir los equipos de emergencias."]},{"i":"exit","s":"safe","x":["Equip d'alarma i evacuació","Equipo de alarma y evacuación"],"d":["Dona l'alarma en la seva zona i dirigeix l'evacuació cap al punt de reunió.","Da la alarma en su zona y dirige la evacuación hacia el punto de reunión."]},{"i":"kit","s":"safe","x":["Equip de primers auxilis","Equipo de primeros auxilios"],"d":["Presta els primers auxilis i ajuda a l'evacuació dels ferits.","Presta los primeros auxilios y ayuda en la evacuación de los heridos."]},{"i":"extinguisher","s":"fire","x":["Equip de primera intervenció","Equipo de primera intervención"],"d":["Controla l'emergència amb els mitjans de què disposa la zona (extintors, etc). Col·labora amb els serveis externs.","Controla la emergencia con los medios de que dispone la zona (extintores, etc.). Colabora con los servicios externos."]},{"i":"hose","s":"fire","x":["Equip de segona intervenció","Equipo de segunda intervención"],"d":["Contribueix amb els equips de primera intervenció quan aquests no poden fer-se càrrec de la situació a causa de la complexitat tècnica d'aquesta, utilitzant mitjans de zones confrontants. Col·labora amb els serveis externs.","Contribuye con los equipos de primera intervención cuando estos no pueden hacerse cargo de la situación debido a su complejidad técnica, utilizando medios de zonas colindantes. Colabora con los servicios externos."]}],"title":["Equips d'emergència","Equipos de emergencia"]}},{"t":"links","title":null,"items":[{"i":"book","x":["Manual de procediments de prevenció de riscos laborals (INSST, PDF)","Manual de procedimientos de prevención de riesgos laborales (INSST, PDF)"],"d":["Banc d'exemples per adaptar procediments d'emergència i primers auxilis (per al docent).","Banco de ejemplos para adaptar procedimientos de emergencia y primeros auxilios (para el docente)."],"url":"https://www.insst.es/documents/94886/455702/Manual_procedimientos.pdf/7a5ca0ee-1845-40b8-9a2f-3143e283f92c"}]}],"acts":["b2-equips","b2-ex4","b2-ex4f"],"videos":[],"part":1,"time":["20 min","20 min"]},{"num":3,"kind":"theory","title":["2.3. Adoptar mesures en cas de risc greu i imminent","2.3. Adoptar medidas en caso de riesgo grave e inminente"],"nodes":[{"t":"p","x":["És aquell risc que és probable que ocorri racionalment en un futur immediat i suposa un mal greu per als treballadors.","Es aquel riesgo que es probable que ocurra racionalmente en un futuro inmediato y supone un daño grave para los trabajadores."]},{"t":"viz","v":{"type":"key","i":"alert","s":"warn","big":["Risc greu i imminent","Riesgo grave e inminente"],"x":["Probable en un futur immediat i amb un mal greu per als treballadors.","Probable en un futuro inmediato y con un daño grave para los trabajadores."]}},{"t":"p","x":["L'empresari està obligat a incloure mesures en el pla d'emergència enfront d'aquest risc i informar els treballadors i els seus representants que existeix aquest risc en el treball: adoptar mesures i donar instruccions perquè els treballadors que no puguin posar-se en contacte amb el superior jeràrquic puguin interrompre l'activitat i abandonar immediatament el treball (prémer el botó de parada d'emergència, abandonar el taller, etc).","El empresario está obligado a incluir medidas en el plan de emergencia frente a este riesgo e informar a los trabajadores y a sus representantes de que existe este riesgo en el trabajo: adoptar medidas y dar instrucciones para que los trabajadores que no puedan ponerse en contacto con el superior jerárquico puedan interrumpir la actividad y abandonar inmediatamente el trabajo (pulsar el botón de parada de emergencia, abandonar el taller, etc.)."]},{"t":"p","x":["Qui pot paralitzar totalment el treball? En principi és l'empresari l'autoritzat a paralitzar el treball, però si aquest no ho fa, també estan facultats els representants dels treballadors, els quals han de comunicar-lo immediatament a l'empresari, disposant l'autoritat laboral d'un termini de 24 hores, perquè aquesta decideixi si continua o no la paralització.","¿Quién puede paralizar totalmente el trabajo? En principio es el empresario el autorizado a paralizar el trabajo, pero si este no lo hace, también están facultados los representantes de los trabajadores, que deben comunicarlo inmediatamente al empresario, disponiendo la autoridad laboral de un plazo de 24 horas para que decida si continúa o no la paralización."]},{"t":"viz","v":{"type":"chain","items":[{"i":"boss","s":"info","x":["L'empresari paralitza","El empresario paraliza"]},{"i":"group","s":"must","x":["Si no ho fa: els representants","Si no lo hace: los representantes"]},{"i":"clock","s":"warn","x":["Autoritat laboral: 24 hores per decidir","Autoridad laboral: 24 horas para decidir"]}],"title":["Qui pot paralitzar el treball?","¿Quién puede paralizar el trabajo?"]}},{"t":"box","k":"example","label":["EXEMPLE","EJEMPLO"],"nodes":[{"t":"p","x":["Exemple 2. En un taller de fusteria una màquina comença a tirar fum i s'observa que s'està cremant per dins. Els dos treballadors surten corrent del taller i criden a l'amo per telèfon perquè acudeixi, perquè és un imprevist davant el qual no saben què fer. Quines obligacions té l'empresa? Solució: 1- L'empresa ha de tenir un pla d'emergència on es tingui prevista la possibilitat que existeixi un risc greu i imminent per als treballadors i com cal actuar. 2- Els treballadors han de ser informats que existeix aquest possible risc, així com rebre instruccions de com paralitzar la seva activitat perquè puguin abandonar el lloc sense perill, quan no poguessin posar-se en contacte amb el superior jeràrquic. 3- En el pla d'emergència haurien d'estar assenyalades les persones encarregades d'actuar en cas d'emergència.","Ejemplo 2. En un taller de carpintería una máquina empieza a echar humo y se observa que se está quemando por dentro. Los dos trabajadores salen corriendo del taller y llaman al dueño por teléfono para que acuda, porque es un imprevisto ante el que no saben qué hacer. ¿Qué obligaciones tiene la empresa? Solución: 1- La empresa debe tener un plan de emergencia en el que se tenga prevista la posibilidad de que exista un riesgo grave e inminente para los trabajadores y cómo hay que actuar. 2- Los trabajadores deben ser informados de que existe este posible riesgo, así como recibir instrucciones de cómo paralizar su actividad para que puedan abandonar el lugar sin peligro, cuando no pudieran ponerse en contacto con el superior jerárquico. 3- En el plan de emergencia deberían estar señaladas las personas encargadas de actuar en caso de emergencia."]}]}],"acts":["b2-rgi"],"videos":[],"part":1,"time":["15 min","15 min"]},{"num":4,"kind":"theory","title":["2.4. Proveir equips de treball i EPIs","2.4. Proveer equipos de trabajo y EPI"],"nodes":[{"t":"p","x":["L'empresari ha de proporcionar equips de treball que siguin segurs, així com adoptar mesures de protecció per a utilitzar aquests equips. Els EPIs ha de complir els següents requisits:","El empresario debe proporcionar equipos de trabajo que sean seguros, así como adoptar medidas de protección para utilizar estos equipos. Los EPI deben cumplir los siguientes requisitos:"]},{"t":"viz","v":{"type":"cards","items":[{"i":"euro","s":"must","x":["Gratuïts","Gratuitos"],"d":["Els EPIs seran lliurats de manera gratuïta per l'empresa.","Los EPI serán entregados de manera gratuita por la empresa."]},{"i":"search","s":"must","x":["Adequats","Adecuados"],"d":["S'avaluaran quins llocs necessiten EPIs i se seleccionaran aquells que siguin adequats al mal del qual protegeixen.","Se evaluará qué puestos necesitan EPI y se seleccionarán aquellos que sean adecuados al daño del que protegen."]},{"i":"tag","s":"must","x":["Marcatge CE","Marcado CE"],"d":["Tots els EPIs han de portar el marcatge CE com a garantia de qualitat en la seva fabricació. Si protegeixen d'un risc molt greu han de disposar d'un codi numèric de 4 dígits (CE-xxxx).","Todos los EPI deben llevar el marcado CE como garantía de calidad en su fabricación. Si protegen de un riesgo muy grave deben disponer de un código numérico de 4 dígitos (CE-xxxx)."]},{"i":"user","s":"must","x":["Ergonòmics i d'ús personal","Ergonómicos y de uso personal"],"d":["Ser ergonòmics i adaptats per a cada treballador. Són d'ús personal.","Ser ergonómicos y adaptados a cada trabajador. Son de uso personal."]},{"i":"learn","s":"must","x":["Informar, formar i vigilar","Informar, formar y vigilar"],"d":["L'empresa ha d'informar i formar als treballadors sobre com usar-los, així com vigilar que s'usin.","La empresa debe informar y formar a los trabajadores sobre cómo usarlos, así como vigilar que se usen."]}],"title":["Requisits dels EPI","Requisitos de los EPI"]}},{"t":"links","title":null,"items":[{"i":"helmet","x":["Equips de protecció individual (INSST)","Equipos de protección individual (INSST)"],"d":["Els EPI s'utilitzen davant riscos que no s'han pogut evitar o limitar prou amb protecció col·lectiva o mesures organitzatives.","Los EPI se utilizan frente a riesgos que no se han podido evitar o limitar suficientemente con protección colectiva o medidas organizativas."],"url":"https://www.insst.es/materias/equipos/epi"}]}],"acts":["b2-ex5","b2-prioritat"],"videos":[],"part":2,"time":["15 min","15 min"]},{"num":5,"kind":"theory","title":["2.5. Formació, informació i vigilància de la salut","2.5. Formación, información y vigilancia de la salud"],"nodes":[{"t":"viz","v":{"type":"compare","cols":[{"i":"learn","s":"must","x":["Donar formació i informació","Dar formación e información"],"items":[["L'empresari ha d'informar els treballadors dels riscos generals de l'empresa i dels específics dels seus llocs de treball, així com de les mesures de prevenció i protecció i en cas d'emergència. Això es concreta en el lliurament del manual de prevenció.","El empresario debe informar a los trabajadores de los riesgos generales de la empresa y de los específicos de sus puestos de trabajo, así como de las medidas de prevención y protección y en caso de emergencia. Esto se concreta en la entrega del manual de prevención."],["A més d'informar, ha d'oferir formació teòrica i pràctica que estigui adaptada als riscos del lloc de treball, en el moment de la contractació o si hi ha modificacions.","Además de informar, debe ofrecer formación teórica y práctica que esté adaptada a los riesgos del puesto de trabajo, en el momento de la contratación o si hay modificaciones."],["La formació es realitza, si és possible, dins de la jornada de treball i es computa com a temps de treball, sense que sigui possible traslladar al treballador els seus costos. Si es realitza fora de l'horari de treball, es descompta el temps invertit en aquesta.","La formación se realiza, si es posible, dentro de la jornada de trabajo y se computa como tiempo de trabajo, sin que sea posible trasladar al trabajador sus costes. Si se realiza fuera del horario de trabajo, se descuenta el tiempo invertido en ella."],["El treballador està obligat a participar en la formació. El curs bàsic és de 30 hores i si hi ha algun risc especial de 50 hores.","El trabajador está obligado a participar en la formación. El curso básico es de 30 horas y, si hay algún riesgo especial, de 50 horas."]]},{"i":"steth","s":"must","x":["Vigilància de la salut","Vigilancia de la salud"],"items":[["L'empresa ha de realitzar a l'inici de l'activitat i periòdicament controls mèdics als treballadors a través dels serveis de prevenció.","La empresa debe realizar al inicio de la actividad y periódicamente controles médicos a los trabajadores a través de los servicios de prevención."],["Només es realitzen les proves imprescindibles i necessàries, respectant la dignitat, intimitat i la confidencialitat de les dades mèdiques, per això només es comunica a l'empresari i representants la condició d'apte o no apte. Els resultats complets es comuniquen al treballador.","Solo se realizan las pruebas imprescindibles y necesarias, respetando la dignidad, intimidad y confidencialidad de los datos médicos; por eso solo se comunica al empresario y a los representantes la condición de apto o no apto. Los resultados completos se comunican al trabajador."],["El treballador pot signar que no vol realitzar-la, tret que sigui obligatòria per llei i la seva no realització comporti greus riscos per a la seva salut.","El trabajador puede firmar que no quiere realizarla, salvo que sea obligatoria por ley y su no realización conlleve graves riesgos para su salud."]]}]}},{"t":"box","k":"example","label":["EXEMPLE","EJEMPLO"],"nodes":[{"t":"p","x":["Exemple 3. A Natalia la contractaran en una fàbrica de paper. L'empresa li vol realitzar un examen mèdic, així que li diu que vagi al servei de prevenció aliè i li facin el reconeixement mèdic complet, i que quan tingui els resultats de les proves les porti a l'oficina i ja li faran el contracte per a començar, ja que fins que no vegin els resultats no saben si poden contractar-la. Les proves sol·licitades són les correctes? Pot l'empresa conèixer els resultats de les proves? Solució: No són les correctes, perquè les proves seran les necessàries i les imprescindibles per al lloc, no un examen complet. L'empresa no pot conèixer els resultats concrets de les proves, per la qual cosa no pot demanar-li que porti els resultats. El servei de prevenció només informarà l'empresa del resultat de si és apta o no apta per a aquest lloc, sense més detalls.","Ejemplo 3. A Natalia la contratarán en una fábrica de papel. La empresa le quiere realizar un examen médico, así que le dice que vaya al servicio de prevención ajeno y le hagan el reconocimiento médico completo, y que cuando tenga los resultados de las pruebas los lleve a la oficina y ya le harán el contrato para empezar, ya que hasta que no vean los resultados no saben si pueden contratarla. ¿Las pruebas solicitadas son las correctas? ¿Puede la empresa conocer los resultados de las pruebas? Solución: No son las correctas, porque las pruebas serán las necesarias e imprescindibles para el puesto, no un examen completo. La empresa no puede conocer los resultados concretos de las pruebas, por lo que no puede pedirle que lleve los resultados. El servicio de prevención solo informará a la empresa del resultado de si es apta o no apta para ese puesto, sin más detalles."]}]}],"acts":["b2-ex6","b2-ex7","b2-ex8"],"videos":[],"part":2,"time":["20 min","20 min"]},{"num":6,"kind":"theory","title":["2.6. Consulta i participació de treballadors","2.6. Consulta y participación de los trabajadores"],"nodes":[{"t":"p","x":["Els representants dels treballadors tenen dret a ser consultats i a participar en les decisions que prengui l'empresa en prevenció de riscos. Això es realitza a través dels delegats de prevenció i del comitè de seguretat i salut:","Los representantes de los trabajadores tienen derecho a ser consultados y a participar en las decisiones que tome la empresa en prevención de riesgos. Esto se realiza a través de los delegados de prevención y del comité de seguridad y salud:"]},{"t":"viz","v":{"type":"compare","cols":[{"i":"user","s":"info","x":["Delegats de prevenció","Delegados de prevención"],"items":[["Són els representants dels treballadors que tenen funcions específiques en prevenció de riscos laborals, sent designats pels propis representants entre ells.","Son los representantes de los trabajadores que tienen funciones específicas en prevención de riesgos laborales, siendo designados por los propios representantes entre ellos."],["El seu número varia segons la taula.","Su número varía según la tabla."]]},{"i":"group","s":"info","x":["Comitè de seguretat i salut","Comité de seguridad y salud"],"items":[["En els centres d'almenys 50 treballadors, i per tant quan hi hagi comitè d'empresa, ha d'existir un comitè de seguretat i salut format tant pels delegats de prevenció com per igual nombre de representants de l'empresa.","En los centros de al menos 50 trabajadores, y por tanto cuando haya comité de empresa, debe existir un comité de seguridad y salud formado tanto por los delegados de prevención como por igual número de representantes de la empresa."],["Per exemple, si una empresa té dos delegats de prevenció, en el comitè de seguretat i salut han d'estar aquests dos delegats més altres dos representants de l'empresa, un total de 4 membres.","Por ejemplo, si una empresa tiene dos delegados de prevención, en el comité de seguridad y salud deben estar estos dos delegados más otros dos representantes de la empresa, un total de 4 miembros."]]}]}},{"t":"p","x":["Els delegats de prevenció i els membres del comitè de seguretat i salut han de tenir una formació mínima en prevenció de nivell bàsic. Les seves competències principals són: a) Ser consultat en les decisions i participar en la planificació de la prevenció, podent realitzar propostes a l'empresa. b) Ser informats dels accidents i acompanyar a la Inspecció. c) Proposar la paralització en cas de risc greu i imminent.","Los delegados de prevención y los miembros del comité de seguridad y salud deben tener una formación mínima en prevención de nivel básico. Sus competencias principales son: a) Ser consultados en las decisiones y participar en la planificación de la prevención, pudiendo realizar propuestas a la empresa. b) Ser informados de los accidentes y acompañar a la Inspección. c) Proponer la paralización en caso de riesgo grave e inminente."]},{"t":"viz","v":{"type":"bars","title":["FIXA-T'HI · Nombre de delegats de prevenció","FÍJATE · Número de delegados de prevención"],"items":[{"x":["Fins a 50 treballadors","Hasta 50 trabajadores"],"v":1,"l":["1","1"]},{"x":["Fins a 100","Hasta 100"],"v":2,"l":["2","2"]},{"x":["Fins a 500","Hasta 500"],"v":3,"l":["3","3"]},{"x":["Fins a 1.000","Hasta 1.000"],"v":4,"l":["4","4"]},{"x":["Fins a 2.000","Hasta 2.000"],"v":5,"l":["5","5"]},{"x":["Fins a 3.000","Hasta 3.000"],"v":6,"l":["6","6"]},{"x":["Fins a 4.000","Hasta 4.000"],"v":7,"l":["7","7"]},{"x":["Més de 4.000","Más de 4.000"],"v":8,"l":["8","8"]}],"note":["Nota: només hi ha representants a partir d'11 treballadors, i entre 6 i 10 si ho decideixen els treballadors.","Nota: solo hay representantes a partir de 11 trabajadores, y entre 6 y 10 si lo deciden los trabajadores."]}},{"t":"viz","v":{"type":"scene","scene":"meeting","title":["Una reunió del comitè de seguretat i salut","Una reunión del comité de seguridad y salud"],"spots":[{"px":140,"py":120,"t":["Delegats de prevenció: representen els treballadors.","Delegados de prevención: representan a los trabajadores."]},{"px":270,"py":120,"t":["Igual nombre de representants de l'empresa.","Igual número de representantes de la empresa."]}],"note":["Escena il·lustrativa (no és al manual).","Escena ilustrativa (no está en el manual)."]}}],"acts":["b2-ex9"],"videos":[],"part":2,"time":["15 min","15 min"]}],"final":["b2-repas"],"acts":[{"id":"b2-emerg","type":"match","time":["3 min","3 min"],"ce":"d","origin":"complementaria","title":["Quin tipus d'emergència és?","¿Qué tipo de emergencia es?"],"pairs":[{"a":["Conat d'emergència","Conato de emergencia"],"b":["L'incendi d'una paperera que s'apaga amb un extintor","El incendio de una papelera que se apaga con un extintor"],"exp":["Es controla de manera senzilla.","Se controla de manera sencilla."]},{"a":["Emergència parcial","Emergencia parcial"],"b":["Calen els equips de tot l'edifici, però els efectes es limiten a una àrea","Hacen falta los equipos de todo el edificio, pero los efectos se limitan a un área"],"exp":["Classificació de les emergències.","Clasificación de las emergencias."]},{"a":["Emergència general","Emergencia general"],"b":["Calen mitjans exteriors i comporta l'evacuació de l'edifici","Hacen falta medios exteriores y conlleva la evacuación del edificio"],"exp":["Classificació de les emergències.","Clasificación de las emergencias."]}],"block":"B2","ra":"RA2"},{"id":"b2-ex3","type":"classify","origin":"manual","time":["4 min","4 min"],"ce":"d","title":["Exercici 3. Comportaments en una evacuació","Ejercicio 3. Comportamientos en una evacuación"],"instr":["Indica quins comportaments són adequats i quins no respecte a una evacuació.","Indica qué comportamientos son adecuados y cuáles no respecto a una evacuación."],"cats":[["Adequat","Adecuado"],["No adequat","No adecuado"]],"items":[{"x":["a) Utilitzar els ascensors i sortir corrent el màxim possible.","a) Utilizar los ascensores y salir corriendo lo máximo posible."],"c":1,"exp":["No s'han d'utilitzar ascensors ni córrer.","No se deben utilizar ascensores ni correr."]},{"x":["b) Tornar als despatxos pels abrics i a tancar amb clau.","b) Volver a los despachos por los abrigos y a cerrar con llave."],"c":1,"exp":["No s'ha d'intentar tornar; les portes es tanquen, però no amb clau.","No se debe intentar volver; las puertas se cierran, pero no con llave."]},{"x":["c) Si hi ha fum cobrir-se el nas i la boca amb un mocador mullat i caminar de quatre grapes.","c) Si hay humo, cubrirse la nariz y la boca con un pañuelo mojado y caminar a gatas."],"c":0,"exp":["Actuació en cas d'incendi.","Actuación en caso de incendio."]},{"x":["d) Dirigir-se al punt de reunió de forma ordenada segons les instruccions dels equips d'alarma i evacuació.","d) Dirigirse al punto de reunión de forma ordenada según las instrucciones de los equipos de alarma y evacuación."],"c":0,"exp":["Mecanismes de resposta i evacuació.","Mecanismos de respuesta y evacuación."]}],"block":"B2","ra":"RA2"},{"id":"b2-equips","type":"match","time":["3 min","3 min"],"ce":"d","origin":"complementaria","title":["Cada equip, la seva funció","Cada equipo, su función"],"pairs":[{"a":["Cap d'emergències","Jefe de emergencias"],"b":["Dona l'alarma i es coordina amb els serveis externs","Da la alarma y se coordina con los servicios externos"],"exp":["Coordinador dels equips.","Coordinador de los equipos."]},{"a":["Cap d'intervenció","Jefe de intervención"],"b":["Acudeix al lloc per dirigir els equips","Acude al lugar para dirigir los equipos"],"exp":["Equips d'emergència.","Equipos de emergencia."]},{"a":["Equip d'alarma i evacuació","Equipo de alarma y evacuación"],"b":["Dirigeix l'evacuació cap al punt de reunió","Dirige la evacuación hacia el punto de reunión"],"exp":["Equips d'emergència.","Equipos de emergencia."]},{"a":["Equip de primers auxilis","Equipo de primeros auxilios"],"b":["Atén els ferits i ajuda a evacuar-los","Atiende a los heridos y ayuda a evacuarlos"],"exp":["Equips d'emergència.","Equipos de emergencia."]},{"a":["Equip de primera intervenció","Equipo de primera intervención"],"b":["Controla l'emergència amb els extintors de la zona","Controla la emergencia con los extintores de la zona"],"exp":["Equips d'emergència.","Equipos de emergencia."]},{"a":["Equip de segona intervenció","Equipo de segunda intervención"],"b":["Ajuda quan la primera intervenció no pot amb la situació","Ayuda cuando la primera intervención no puede con la situación"],"exp":["Equips d'emergència.","Equipos de emergencia."]}],"block":"B2","ra":"RA2"},{"id":"b2-ex4","type":"mcq","origin":"manual","time":["7 min","7 min"],"ce":"d","title":["Exercici 4. L'incendi de la fàbrica","Ejercicio 4. El incendio de la fábrica"],"instr":["Fa diversos anys una fàbrica va redactar el pla d'autoprotecció designant als equips d'emergències: el director de producció és el cap d'emergències, el cap de taller és el cap d'intervenció, a Ana se li assigna en l'equip d'alarma i evacuació, a Luisa en el de primers auxilis i a Pedro en el de primera intervenció. Des de llavors no s'ha tornat a parlar d'emergències, però fa una setmana s'ha produït un incendi en una màquina per un curtcircuit amb perill de propagació i ningú sabia qui havia de fer què fins que va arribar el cap de taller i es va fer càrrec de la situació amb l'extintor mentre els altres li observaven.","Hace varios años una fábrica redactó el plan de autoprotección designando a los equipos de emergencias: el director de producción es el jefe de emergencias, el jefe de taller es el jefe de intervención, a Ana se le asigna al equipo de alarma y evacuación, a Luisa al de primeros auxilios y a Pedro al de primera intervención. Desde entonces no se ha vuelto a hablar de emergencias, pero hace una semana se produjo un incendio en una máquina por un cortocircuito con peligro de propagación y nadie sabía quién tenía que hacer qué hasta que llegó el jefe de taller y se hizo cargo de la situación con el extintor mientras los demás lo observaban."],"questions":[{"q":["a) A qui calia avisar que s'havia produït un incendi?","a) ¿A quién había que avisar de que se había producido un incendio?"],"opts":[["Al director de producció (cap d'emergències)","Al director de producción (jefe de emergencias)"],["A Luisa","A Luisa"],["A ningú: ho resol el cap de taller","A nadie: lo resuelve el jefe de taller"]],"ans":0,"exp":["El cap d'emergències dona l'alarma i coordina els equips.","El jefe de emergencias da la alarma y coordina los equipos."]},{"q":["b) Una vegada rebuda l'alerta, què fa el cap d'emergències?","b) Una vez recibida la alerta, ¿qué hace el jefe de emergencias?"],"opts":[["Apaga el foc personalment","Apaga el fuego personalmente"],["Dona l'alarma i es coordina amb els serveis externs","Da la alarma y se coordina con los servicios externos"],["Presta els primers auxilis","Presta los primeros auxilios"]],"ans":1,"exp":["Funcions del cap d'emergències.","Funciones del jefe de emergencias."]},{"q":["c) Qui s'encarregava de l'evacuació dels treballadors?","c) ¿Quién se encargaba de la evacuación de los trabajadores?"],"opts":[["Ana","Ana"],["Luisa","Luisa"],["Pedro","Pedro"]],"ans":0,"exp":["Equip d'alarma i evacuació.","Equipo de alarma y evacuación."]},{"q":["d) Qui havia de prestar els primers auxilis a qui ho necessités?","d) ¿Quién debía prestar los primeros auxilios a quien los necesitara?"],"opts":[["Ana","Ana"],["Luisa","Luisa"],["Pedro","Pedro"]],"ans":1,"exp":["Equip de primers auxilis.","Equipo de primeros auxilios."]},{"q":["e) Qui havia de fer-se càrrec de la situació amb l'extintor?","e) ¿Quién debía hacerse cargo de la situación con el extintor?"],"opts":[["Ana","Ana"],["Luisa","Luisa"],["Pedro","Pedro"]],"ans":2,"exp":["Equip de primera intervenció, dirigit pel cap d'intervenció.","Equipo de primera intervención, dirigido por el jefe de intervención."]}],"block":"B2","ra":"RA2"},{"id":"b2-ex4f","type":"teacher","origin":"manual","time":["5 min","5 min"],"group":["Individual","Individual"],"ce":"d","title":["Exercici 4 f) i què va fallar","Ejercicio 4 f) y qué falló"],"fields":[["f) Quin tipus d'extintor calia utilitzar si hi ha electricitat?","f) ¿Qué tipo de extintor había que utilizar si hay electricidad?"],["Què va fallar en el pla d'autoprotecció de la fàbrica? (pensa en la formació, els cartells i els simulacres)","¿Qué falló en el plan de autoprotección de la fábrica? (piensa en la formación, los carteles y los simulacros)"]],"block":"B2","ra":"RA2"},{"id":"b2-rgi","type":"tf","time":["4 min","4 min"],"ce":"d, e","origin":"complementaria","title":["Risc greu i imminent","Riesgo grave e inminente"],"questions":[{"q":["Si no poden contactar amb el superior, els treballadors poden interrompre l'activitat i abandonar el treball.","Si no pueden contactar con el superior, los trabajadores pueden interrumpir la actividad y abandonar el trabajo."],"ans":true,"exp":["L'empresari ha de donar instruccions per fer-ho.","El empresario debe dar instrucciones para hacerlo."]},{"q":["Només l'empresari pot paralitzar totalment el treball.","Solo el empresario puede paralizar totalmente el trabajo."],"ans":false,"exp":["Si no ho fa, també ho poden fer els representants dels treballadors.","Si no lo hace, también pueden hacerlo los representantes de los trabajadores."]},{"q":["L'autoritat laboral té 24 hores per decidir si continua la paralització.","La autoridad laboral tiene 24 horas para decidir si continúa la paralización."],"ans":true,"exp":["Apartat 2.3.","Apartado 2.3."]},{"q":["Les mesures enfront del risc greu i imminent s'han d'incloure en el pla d'emergència.","Las medidas frente al riesgo grave e inminente deben incluirse en el plan de emergencia."],"ans":true,"exp":["Apartat 2.3 i exemple 2.","Apartado 2.3 y ejemplo 2."]}],"block":"B2","ra":"RA2"},{"id":"b2-ex5","type":"tf","origin":"manual","time":["4 min","4 min"],"ce":"e","title":["Exercici 5. Els EPI de Carmen","Ejercicio 5. Los EPI de Carmen"],"instr":["Carmen acaba de començar a treballar en una cadena de muntatge d'ordinadors substituint a una altra persona de baixa. L'encarregat li lliura uns guants i cascos usats per la persona a la qual ella supleix, els quals li venen grans. Com no li ve de gust posar-se res de ningú està pensant a comprar-se ella mateixa els guants, a més els EPIs indica \"made in la Xina\" i no es fia ja que el risc de sordesa és molt greu.","Carmen acaba de empezar a trabajar en una cadena de montaje de ordenadores sustituyendo a otra persona de baja. El encargado le entrega unos guantes y cascos usados por la persona a la que ella suple, que le quedan grandes. Como no le apetece ponerse nada de nadie, está pensando en comprarse ella misma los guantes; además, los EPI indican \"made in China\" y no se fía, ya que el riesgo de sordera es muy grave."],"questions":[{"q":["a) L'empresa li pot lliurar aquests EPI usats que li venen grans.","a) La empresa le puede entregar estos EPI usados que le quedan grandes."],"ans":false,"exp":["Els EPI són d'ús personal i han d'estar adaptats a cada treballador.","Los EPI son de uso personal y deben estar adaptados a cada trabajador."]},{"q":["b) Carmen s'hauria de comprar els EPI.","b) Carmen debería comprarse los EPI."],"ans":false,"exp":["L'empresa els lliura de manera gratuïta.","La empresa los entrega de manera gratuita."]},{"q":["c) Si el risc és molt greu, l'etiqueta ha de portar el marcatge CE amb un codi numèric de 4 dígits (CE-xxxx).","c) Si el riesgo es muy grave, la etiqueta debe llevar el marcado CE con un código numérico de 4 dígitos (CE-xxxx)."],"ans":true,"exp":["El que importa és el marcatge CE, no el país de fabricació.","Lo que importa es el marcado CE, no el país de fabricación."]}],"block":"B2","ra":"RA2"},{"id":"b2-prioritat","type":"order","time":["3 min","3 min"],"ce":"e, g","origin":"complementaria","title":["Davant d'un mateix risc, què va primer?","Ante un mismo riesgo, ¿qué va primero?"],"items":[["Eliminar o reduir el risc en l'origen","Eliminar o reducir el riesgo en origen"],["Implantar una protecció col·lectiva o una mesura organitzativa","Implantar una protección colectiva o una medida organizativa"],["Proporcionar un EPI","Proporcionar un EPI"]],"exp":["Portal EPI de l'INSST: els EPI s'utilitzen davant riscos que no s'han pogut evitar o limitar prou amb protecció col·lectiva o mesures organitzatives.","Portal EPI del INSST: los EPI se utilizan frente a riesgos que no se han podido evitar o limitar suficientemente con protección colectiva o medidas organizativas."],"block":"B2","ra":"RA2"},{"id":"b2-ex6","type":"tf","origin":"manual","time":["4 min","4 min"],"ce":"e","title":["Exercici 6. El manual i les màscares de casa","Ejercicio 6. El manual y las mascarillas de casa"],"instr":["A un treballador li lliuren el manual de prevenció de riscos amb els riscos generals i les mesures de prevenció, perquè el signi en ser contractat. Al mateix temps, li diuen que es porti les màscares i guants de casa, i que si no té el pot comprar en qualsevol botiga.","A un trabajador le entregan el manual de prevención de riesgos con los riesgos generales y las medidas de prevención, para que lo firme al ser contratado. Al mismo tiempo, le dicen que se traiga las mascarillas y guantes de casa, y que si no tiene los puede comprar en cualquier tienda."],"questions":[{"q":["a) El treballador ha estat ben informat.","a) El trabajador ha sido bien informado."],"ans":false,"exp":["Falten els riscos específics del seu lloc i les mesures en cas d'emergència.","Faltan los riesgos específicos de su puesto y las medidas en caso de emergencia."]},{"q":["b) A més d'informar, en el moment de contractar l'empresa ha d'oferir formació teòrica i pràctica adaptada als riscos del lloc.","b) Además de informar, en el momento de contratar la empresa debe ofrecer formación teórica y práctica adaptada a los riesgos del puesto."],"ans":true,"exp":["Apartat 2.5.","Apartado 2.5."]},{"q":["c) El treballador ha de comprar els EPI.","c) El trabajador debe comprar los EPI."],"ans":false,"exp":["Els EPI els lliura l'empresa de manera gratuïta i han de ser adequats.","Los EPI los entrega la empresa de manera gratuita y deben ser adecuados."]}],"block":"B2","ra":"RA2"},{"id":"b2-ex7","type":"tf","origin":"manual","time":["4 min","4 min"],"ce":"e","title":["Exercici 7. La formació de Luis Alfonso","Ejercicio 7. La formación de Luis Alfonso"],"instr":["Luis Alfonso serà contractat durant 1 any. L'empresa li pregunta si sap una mica de prevenció de riscos i Luis Alfonso contesta que en classe de IPE I alguna cosa va veure. L'empresa li diu que repassi el llibre de IPE I perquè ha d'estar format en matèria de prevenció de riscos per a poder treballar, encara que de tota manera li lliurarà el manual de prevenció perquè també li ho llegeixi.","Luis Alfonso será contratado durante 1 año. La empresa le pregunta si sabe un poco de prevención de riesgos y Luis Alfonso contesta que en clase de IPE I algo vio. La empresa le dice que repase el libro de IPE I porque debe estar formado en materia de prevención de riesgos para poder trabajar, aunque de todas formas le entregará el manual de prevención para que también lo lea."],"questions":[{"q":["a) El llibre d'IPE I o el manual de prevenció substitueixen la formació.","a) El libro de IPE I o el manual de prevención sustituyen la formación."],"ans":false,"exp":["El manual és informació; la formació ha de ser teòrica i pràctica i adaptada als riscos del lloc.","El manual es información; la formación debe ser teórica y práctica y adaptada a los riesgos del puesto."]},{"q":["b) Hi ha motiu per donar-li formació: és el moment de la contractació.","b) Hay motivo para darle formación: es el momento de la contratación."],"ans":true,"exp":["Apartat 2.5.","Apartado 2.5."]},{"q":["c) El treballador està obligat a participar en la formació.","c) El trabajador está obligado a participar en la formación."],"ans":true,"exp":["Apartat 2.5.","Apartado 2.5."]},{"q":["d) La formació ha de tractar els riscos del seu lloc de treball.","d) La formación debe tratar los riesgos de su puesto de trabajo."],"ans":true,"exp":["Adaptada als riscos del lloc.","Adaptada a los riesgos del puesto."]},{"q":["e) La formació s'ha de fer, si és possible, dins de la jornada de treball.","e) La formación debe hacerse, si es posible, dentro de la jornada de trabajo."],"ans":true,"exp":["Apartat 2.5.","Apartado 2.5."]},{"q":["f) Si es fa fora de l'horari, no compta com a temps de treball.","f) Si se hace fuera del horario, no cuenta como tiempo de trabajo."],"ans":false,"exp":["Es descompta el temps invertit.","Se descuenta el tiempo invertido."]}],"block":"B2","ra":"RA2"},{"id":"b2-ex8","type":"tf","origin":"manual","time":["4 min","4 min"],"ce":"e","title":["Exercici 8. El reconeixement de José Ramón","Ejercicio 8. El reconocimiento de José Ramón"],"instr":["A José Ramón li indiquen que abans de començar a treballar ha d'anar al seu metge de la seguretat social per a demanar-li un reconeixement mèdic complet, i portar els resultats a l'empresa per a veure si és apte o no per al treball en el taller.","A José Ramón le indican que antes de empezar a trabajar debe ir a su médico de la seguridad social para pedirle un reconocimiento médico completo, y llevar los resultados a la empresa para ver si es apto o no para el trabajo en el taller."],"questions":[{"q":["a) Ha d'anar al seu metge de la seguretat social.","a) Debe ir a su médico de la seguridad social."],"ans":false,"exp":["Els controls es fan a través dels serveis de prevenció.","Los controles se hacen a través de los servicios de prevención."]},{"q":["b) Un reconeixement complet és la prova correcta.","b) Un reconocimiento completo es la prueba correcta."],"ans":false,"exp":["Només les proves imprescindibles i necessàries per al lloc.","Solo las pruebas imprescindibles y necesarias para el puesto."]},{"q":["c) Ha de recollir els resultats i lliurar-los a l'empresa.","c) Debe recoger los resultados y entregarlos a la empresa."],"ans":false,"exp":["L'empresa no pot conèixer els resultats concrets.","La empresa no puede conocer los resultados concretos."]},{"q":["d) L'empresa només pot conèixer si és apte o no apte.","d) La empresa solo puede conocer si es apto o no apto."],"ans":true,"exp":["Confidencialitat de les dades mèdiques.","Confidencialidad de los datos médicos."]},{"q":["e) El treballador rep els resultats complets.","e) El trabajador recibe los resultados completos."],"ans":true,"exp":["Apartat 2.5.","Apartado 2.5."]},{"q":["f) Es pot negar a fer-se el reconeixement, tret que sigui obligatori per llei i no fer-lo comporti greus riscos per a la seva salut.","f) Se puede negar a hacerse el reconocimiento, salvo que sea obligatorio por ley y no hacerlo conlleve graves riesgos para su salud."],"ans":true,"exp":["Apartat 2.5.","Apartado 2.5."]}],"block":"B2","ra":"RA2"},{"id":"b2-ex9","type":"fill","origin":"manual","time":["5 min","5 min"],"ce":"e","title":["Exercici 9. Quants delegats i membres del comitè?","Ejercicio 9. ¿Cuántos delegados y miembros del comité?"],"items":[{"x":["a) Una cadena de cinemes amb 250 treballadors té ___ delegats de prevenció.","a) Una cadena de cines con 250 trabajadores tiene ___ delegados de prevención."],"opts":[["2","2"],["3","3"],["4","4"]],"ans":1,"exp":["Fins a 500 → 3.","Hasta 500 → 3."]},{"x":["a) El seu comitè de seguretat i salut té ___ membres.","a) Su comité de seguridad y salud tiene ___ miembros."],"opts":[["3","3"],["6","6"],["12","12"]],"ans":1,"exp":["3 delegats + 3 representants de l'empresa.","3 delegados + 3 representantes de la empresa."]},{"x":["b) Una fàbrica d'automòbils amb 3.600 treballadors té ___ delegats de prevenció.","b) Una fábrica de automóviles con 3.600 trabajadores tiene ___ delegados de prevención."],"opts":[["6","6"],["7","7"],["8","8"]],"ans":1,"exp":["Fins a 4.000 → 7.","Hasta 4.000 → 7."]},{"x":["b) El seu comitè de seguretat i salut té ___ membres.","b) Su comité de seguridad y salud tiene ___ miembros."],"opts":[["7","7"],["14","14"],["16","16"]],"ans":1,"exp":["7 delegats + 7 representants de l'empresa.","7 delegados + 7 representantes de la empresa."]},{"x":["c) Una botiga de
