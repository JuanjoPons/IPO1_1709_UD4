medidas de evacuación."]},"art":"kit","parts":[{"title":["Pla d'emergència i risc greu i imminent","Plan de emergencia y riesgo grave e inminente"],"time":["55 min","55 min"],"min":55},{"title":["EPI, formació, vigilància de la salut i participació","EPI, formación, vigilancia de la salud y participación"],"time":["55 min","55 min"],"min":55}],"tabLabel":["Bloc 2","Bloque 2"]},{"id":"B3","ud":"UD4","title":["2.7 a 3. Accidents, responsabilitats i obligacions dels treballadors","2.7 a 3. Accidentes, responsabilidades y obligaciones de los trabajadores"],"meta":{"ra_fp":"RA2","ce_txt":"RA2 e, g","pes":["Proposta: 1 sessió de 55 min","Propuesta: 1 sesión de 55 min"]},"sections":[{"num":1,"kind":"theory","title":["2.7. La gestió dels accidents de treball","2.7. La gestión de los accidentes de trabajo"],"nodes":[{"t":"p","x":["Les empreses han d'investigar els accidents que han ocorregut de cara a conèixer les circumstàncies i les causes que els han produït, de manera que puguin evitar-se altres accidents futurs. La llei obliga a investigar els accidents però no diu quins. És el INSST el que assenyala els següents:","Las empresas deben investigar los accidentes que han ocurrido de cara a conocer las circunstancias y las causas que los han producido, de manera que puedan evitarse otros accidentes futuros. La ley obliga a investigar los accidentes, pero no dice cuáles. Es el INSST el que señala los siguientes:"]},{"t":"viz","v":{"type":"steps","items":[{"i":"alert","s":"ban","x":["En primer lloc","En primer lugar"],"d":["Tots els mortals i tots els greus.","Todos los mortales y todos los graves."]},{"i":"search","s":"warn","x":["En segon lloc","En segundo lugar"],"d":["Els accidents lleus i els accidents blancs (danys materials sense lesions) quan es presentin de manera repetitiva, existeixi risc de lesions greus o les seves causes no siguin conegudes.","Los accidentes leves y los accidentes blancos (daños materiales sin lesiones) cuando se presenten de manera repetitiva, exista riesgo de lesiones graves o sus causas no sean conocidas."]},{"i":"doc","s":"info","x":["Registrar i notificar","Registrar y notificar"],"d":["A més, ha de registrar i notificar els accidents a l'Administració Laboral, perquè disposi d'informació per a elaborar estadístiques d'accidents de treball.","Además, debe registrar y notificar los accidentes a la Administración Laboral, para que disponga de información para elaborar estadísticas de accidentes de trabajo."]}]}},{"t":"links","title":null,"items":[{"i":"search","x":["Investigació d'accidents pel mètode de l'arbre de causes (INSST)","Investigación de accidentes por el método del árbol de causas (INSST)"],"d":["Lesió → fets que la van fer possible → fallades materials o organitzatives → mesures. Busqueu causes i mesures, no culpables.","Lesión → hechos que la hicieron posible → fallos materiales u organizativos → medidas. Buscad causas y medidas, no culpables."],"url":"https://www.insst.es/documentacion/material-tecnico/documentos-tecnicos/investigacion-accidentes-por-el-metodo-del-arbol-de-causas-2012"}]}],"acts":["b3-investigar"],"videos":[],"part":1,"time":["8 min","8 min"]},{"num":2,"kind":"theory","title":["2.8. Els costos dels accidents","2.8. Los costes de los accidentes"],"nodes":[{"t":"p","x":["Els accidents comporten uns costos, tant per a l'empresa, per al treballador, com per a la societat:","Los accidentes conllevan unos costes, tanto para la empresa, para el trabajador, como para la sociedad:"]},{"t":"viz","v":{"type":"compare","cols":[{"i":"factory","s":"ban","x":["Costos per a l'empresa","Costes para la empresa"],"items":[["Salaris i indemnitzacions al treballador.","Salarios e indemnizaciones al trabajador."],["Pèrdua de productivitat per part del treballador i/o els companys després de l'accident.","Pérdida de productividad por parte del trabajador y/o los compañeros después del accidente."],["Temps perduts per companys i comandaments en auxiliar a l'accidentat.","Tiempos perdidos por compañeros y mandos en auxiliar al accidentado."],["Temps utilitzats a investigar i notificar l'accident.","Tiempos utilizados en investigar y notificar el accidente."],["Major conflictivitat laboral.","Mayor conflictividad laboral."],["Danys materials a instal·lacions i equips.","Daños materiales en instalaciones y equipos."],["Sancions econòmiques i penals.","Sanciones económicas y penales."],["Pèrdua d'imatge.","Pérdida de imagen."]]},{"i":"heart","s":"ban","x":["Costos per al treballador (i la seva família)","Costes para el trabajador (y su familia)"],"items":[["Suposa el dolor i sofriment per l'accident, la pèrdua de capacitat professional i la disminució temporal o definitiva d'ingressos.","Supone el dolor y sufrimiento por el accidente, la pérdida de capacidad profesional y la disminución temporal o definitiva de ingresos."]]},{"i":"group","s":"ban","x":["Costos per a la societat","Costes para la sociedad"],"items":[["Significa la pèrdua de recursos humans per mort o de capacitat productiva per minusvalideses, el pagament d'indemnitzacions de la seguretat social, la gestió de l'accident per la Inspecció de Treball, judicis laborals...","Significa la pérdida de recursos humanos por muerte o de capacidad productiva por discapacidades, el pago de indemnizaciones de la seguridad social, la gestión del accidente por la Inspección de Trabajo, juicios laborales..."]]}]}},{"t":"box","k":"example","label":["EXEMPLE","EJEMPLO"],"nodes":[{"t":"p","x":["Exemple 4. Tipus de costos. En una empresa de fabricació de components elèctrics s'ha produït un accident greu a primera hora del matí en quedar-se enganxat un treballador amb una màquina i amputar-li 4 dits d'una mà. Els seus companys a penes van poder treballar la resta del matí perquè es van quedar molt afectats. L'accident va comportar 1 dia de recerca pel tècnic de prevenció i de 2 dies per l'inspector de treball, el qual sancionarà a l'empresa. La premsa s'ha fet eco de l'accident, i la família del treballador està molt afectada en veure-li la mà, a més de que temen que no pugui tornar a treballar i la pèrdua d'ingressos futurs. La seguretat social es farà càrrec de la baixa.","Ejemplo 4. Tipos de costes. En una empresa de fabricación de componentes eléctricos se ha producido un accidente grave a primera hora de la mañana al quedarse enganchado un trabajador con una máquina y amputarle 4 dedos de una mano. Sus compañeros apenas pudieron trabajar el resto de la mañana porque quedaron muy afectados. El accidente conllevó 1 día de investigación por el técnico de prevención y 2 días por el inspector de trabajo, que sancionará a la empresa. La prensa se ha hecho eco del accidente, y la familia del trabajador está muy afectada al verle la mano, además de que temen que no pueda volver a trabajar y la pérdida de ingresos futuros. La seguridad social se hará cargo de la baja."]},{"t":"links","title":null,"items":[{"i":"doc","x":["Tema 31. Investigació d'accidents de treball (INSST, PDF)","Tema 31. Investigación de accidentes de trabajo (INSST, PDF)"],"d":["Inclou l'estimació de costos directes i ocults. El cost no pot justificar mesures menys eficaces.","Incluye la estimación de costes directos y ocultos. El coste no puede justificar medidas menos eficaces."],"url":"https://www.insst.es/documents/d/portal-insst/tema-31-investigacion-de-accidentes-de-trabajo"}]}]}],"acts":["b3-costos","b3-ex10","b3-ex10gh"],"videos":[],"part":1,"time":["15 min","15 min"]},{"num":3,"kind":"theory","title":["2.9. La responsabilitat de les empreses en prevenció","2.9. La responsabilidad de las empresas en prevención"],"nodes":[{"t":"p","x":["Les infraccions que cometin les empreses no sols són objecte de sanció administrativa per la Inspecció de Treball, sinó que a més pot portar altres responsabilitats civils, penals i de recàrrecs.","Las infracciones que cometan las empresas no solo son objeto de sanción administrativa por la Inspección de Trabajo, sino que además pueden conllevar otras responsabilidades civiles, penales y de recargos."]},{"t":"viz","v":{"type":"cards","cols":2,"title":["Responsabilitats de l'empresa","Responsabilidades de la empresa"],"items":[{"i":"doc","s":"ban","x":["Administrativa","Administrativa"],"d":["Les sancions de la Inspecció poden ser lleus, greus o molt greus, oscil·lant entre 45€ i 983.736€. A més pot sancionar-se amb la paralització de l'activitat o el tancament del centre de treball.","Las sanciones de la Inspección pueden ser leves, graves o muy graves, oscilando entre 45 € y 983.736 €. Además puede sancionarse con la paralización de la actividad o el cierre del centro de trabajo."]},{"i":"euro","s":"ban","x":["Civil","Civil"],"d":["És la demanda d'una indemnització econòmica per danys i perjudicis pels danys causats als treballadors.","Es la demanda de una indemnización económica por daños y perjuicios por los daños causados a los trabajadores."]},{"i":"gavel","s":"ban","x":["Penal","Penal"],"d":["Quan es posa en perill greu la vida, la salut o la integritat física dels treballadors. No cal que existeixin danys, amb posar en perill és suficient. La sanció pot ser una multa, però també privació de llibertat.","Cuando se pone en peligro grave la vida, la salud o la integridad física de los trabajadores. No es necesario que existan daños; con poner en peligro es suficiente. La sanción puede ser una multa, pero también privación de libertad."]},{"i":"money","s":"ban","x":["Recàrrec de prestacions","Recargo de prestaciones"],"d":["Si l'accident és conseqüència per falta de mesures de prevenció, a l'empresari se li imposa un recàrrec entre el 30% i el 50% de la prestació que rebi el treballador. Si per exemple ha de cobrar 1.000€ per estar de baixa, l'empresari ha de pagar altres 300-500€ afegits.","Si el accidente es consecuencia de la falta de medidas de prevención, al empresario se le impone un recargo de entre el 30 % y el 50 % de la prestación que reciba el trabajador. Si, por ejemplo, debe cobrar 1.000 € por estar de baja, el empresario debe pagar otros 300-500 € añadidos."]}]}},{"t":"links","title":null,"items":[{"i":"doc","x":["Tema 21. Les responsabilitats en PRL (INSST, PDF)","Tema 21. Las responsabilidades en PRL (INSST, PDF)"],"d":["Documentació de suport per preparar supòsits d'incompliments i responsabilitats.","Documentación de apoyo para preparar supuestos de incumplimientos y responsabilidades."],"url":"https://www.insst.es/documents/94886/3978182/Tema%2021.%20Las%20Responsabilidades%20en%20PRL.pdf/13d11709-ada5-6283-d613-59baf5ef4eb9"}]}],"acts":["b3-ex11"],"videos":[],"part":1,"time":["10 min","10 min"]},{"num":4,"kind":"theory","title":["2.10. El paper de la Inspecció de Treball","2.10. El papel de la Inspección de Trabajo"],"nodes":[{"t":"p","x":["És l'organisme encarregat de vigilar que es compleixi la normativa laboral i de prevenció de riscos laborals. Per a això realitza les següents funcions:","Es el organismo encargado de vigilar que se cumpla la normativa laboral y de prevención de riesgos laborales. Para ello realiza las siguientes funciones:"]},{"t":"viz","v":{"type":"cards","items":[{"i":"eye","s":"info","x":["Visita","Visita"],"d":["Visita empreses per a vigilar que es compleix la normativa vigent.","Visita empresas para vigilar que se cumple la normativa vigente."]},{"i":"doc","s":"ban","x":["Actes d'infracció","Actas de infracción"],"d":["Aixeca actes d'infracció i proposa sancions en cas que detecti incompliments de la normativa de prevenció. La seva proposta de sanció sol ratificar-se per l'òrgan de l'administració.","Levanta actas de infracción y propone sanciones en caso de que detecte incumplimientos de la normativa de prevención. Su propuesta de sanción suele ratificarse por el órgano de la administración."]},{"i":"alert","s":"warn","x":["Advertiments i requeriments","Advertencias y requerimientos"],"d":["Si considera que la infracció no és prou greu, pot realitzar advertiments i requeriments. Un requeriment consisteix en un escrit perquè l'empresa modifiqui unes certes condicions de treball, les quals, si no són modificades en un determinat termini, condueixen a una sanció.","Si considera que la infracción no es suficientemente grave, puede realizar advertencias y requerimientos. Un requerimiento consiste en un escrito para que la empresa modifique ciertas condiciones de trabajo, que, si no se modifican en un determinado plazo, conducen a una sanción."]},{"i":"lock","s":"ban","x":["Paralització immediata","Paralización inmediata"],"d":["Si detecta un risc greu i imminent per a la salut dels treballadors pot ordenar la paralització immediata de l'activitat i el tancament temporal de l'empresa.","Si detecta un riesgo grave e inminente para la salud de los trabajadores puede ordenar la paralización inmediata de la actividad y el cierre temporal de la empresa."]},{"i":"checklist","s":"info","x":["Informes","Informes"],"d":["Elabora informes en cas d'accidents mortals, greus o molt greus.","Elabora informes en caso de accidentes mortales, graves o muy graves."]}],"title":["Funcions de la Inspecció de Treball","Funciones de la Inspección de Trabajo"]}},{"t":"p","x":["Per ampliar: articles 9 (Inspecció de Treball) i 42 (responsabilitats) de la Llei de Prevenció de Riscos Laborals.","Para ampliar: artículos 9 (Inspección de Trabajo) y 42 (responsabilidades) de la Ley de Prevención de Riesgos Laborales."]},{"t":"links","title":null,"items":[{"i":"gavel","x":["Llei de Prevenció de Riscos Laborals (BOE)","Ley de Prevención de Riesgos Laborales (BOE)"],"d":["Text consolidat. Articles clau: 14–16 (protecció, principis, pla), 17 (equips i EPI), 18–19 (informació i formació), 20–21 (emergències i risc greu), 22 (salut), 29 (treballadors), 30–31 (organització), 33–36 (participació), 9 i 42 (Inspecció i responsabilitats).","Texto consolidado. Artículos clave: 14–16 (protección, principios, plan), 17 (equipos y EPI), 18–19 (información y formación), 20–21 (emergencias y riesgo grave), 22 (salud), 29 (trabajadores), 30–31 (organización), 33–36 (participación), 9 y 42 (Inspección y responsabilidades)."],"url":"https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292"}]}],"acts":["b3-inspeccio"],"videos":[],"part":1,"time":["7 min","7 min"]},{"num":5,"kind":"theory","title":["3. Obligacions dels treballadors","3. Obligaciones de los trabajadores"],"nodes":[{"t":"p","x":["Que la principal responsable sigui l'empresa no eximeix als treballadors de tenir també unes obligacions sobre prevenció de riscos. Els treballadors, conformement a la seva formació i seguint les instruccions de l'empresari, deuen:","Que la principal responsable sea la empresa no exime a los trabajadores de tener también unas obligaciones sobre prevención de riesgos. Los trabajadores, conforme a su formación y siguiendo las instrucciones del empresario, deben:"]},{"t":"viz","v":{"type":"cards","items":[{"i":"helmet","s":"must","x":["Usar adequadament","Usar adecuadamente"],"d":["Els equips de treball, màquines, eines i EPIs facilitats per l'empresari, així com no posar fora de funcionament els dispositius de seguretat.","Los equipos de trabajo, máquinas, herramientas y EPI facilitados por el empresario, así como no poner fuera de funcionamiento los dispositivos de seguridad."]},{"i":"megaphone","s":"must","x":["Informar immediatament","Informar inmediatamente"],"d":["Els seus superiors o als delegats de prevenció de qualsevol situació que, al seu judici, comporti un risc per als treballadors.","A sus superiores o a los delegados de prevención de cualquier situación que, a su juicio, conlleve un riesgo para los trabajadores."]},{"i":"handshake","s":"must","x":["Cooperar","Cooperar"],"d":["Amb l'empresari en matèria de prevenció.","Con el empresario en materia de prevención."]}],"title":["Obligacions dels treballadors","Obligaciones de los trabajadores"]}},{"t":"p","x":["Quines responsabilitats tenen els treballadors per incomplir les seves obligacions en prevenció? Si un treballador incompleix les seves obligacions en matèria preventiva pot ser sancionat per l'empresari conforme a les faltes lleus, greus i molt greus que assenyala el conveni col·lectiu. La sanció pot variar des d'una amonestació verbal a l'acomiadament disciplinari procedent, sense perjudici que pugui tenir responsabilitat civil, o fins i tot penal, pels danys que causi.","¿Qué responsabilidades tienen los trabajadores por incumplir sus obligaciones en prevención? Si un trabajador incumple sus obligaciones en materia preventiva puede ser sancionado por el empresario conforme a las faltas leves, graves y muy graves que señala el convenio colectivo. La sanción puede variar desde una amonestación verbal hasta el despido disciplinario procedente, sin perjuicio de que pueda tener responsabilidad civil, o incluso penal, por los daños que cause."]},{"t":"video","id":"napo-moves","title":["Napo en… moure's segur","Napo en… moverse seguro"],"source":["Napo (EU-OSHA)","Napo (EU-OSHA)"],"duration":"11:32","url":"https://www.youtube.com/watch?v=DeVJmPMsOIw","verified":true,"langLabel":["sense diàlegs","sin diálogos"],"moment":["per tancar el bloc: una o dues escenes (o a casa, sencer).","para cerrar el bloque: una o dos escenas (o en casa, entero)."],"use":["Relaciona la seguretat amb la planificació, l'execució, el seguiment, la implicació de la direcció, la capacitació i la participació de les persones treballadores. Ajuda a no atribuir tots els accidents només al comportament individual.","Relaciona la seguridad con la planificación, ejecución, seguimiento, implicación de la dirección, capacitación y participación de las personas trabajadoras. Ayuda a no atribuir todos los accidentes únicamente al comportamiento individual."],"question":["Fes dues columnes: què hauria d'haver previst o gestionat l'organització, i quina conducta o comunicació necessiten les persones treballadores.","Haz dos columnas: qué debería haber previsto o gestionado la organización, y qué conducta o comunicación necesitan las personas trabajadoras."]}],"acts":["b3-qui","b3-ex12","b3-conveni"],"videos":[],"part":1,"time":["10 min","10 min"]}],"final":["b3-prova"],"acts":[{"id":"b3-investigar","type":"tf","time":["3 min","3 min"],"ce":"e","origin":"complementaria","title":["Quins accidents s'investiguen?","¿Qué accidentes se investigan?"],"questions":[{"q":["Tots els accidents mortals i greus s'han d'investigar en primer lloc.","Todos los accidentes mortales y graves deben investigarse en primer lugar."],"ans":true,"exp":["Criteri de l'INSST.","Criterio del INSST."]},{"q":["Un accident blanc és el que no causa danys materials.","Un accidente blanco es el que no causa daños materiales."],"ans":false,"exp":["Accident blanc: danys materials sense lesions.","Accidente blanco: daños materiales sin lesiones."]},{"q":["La llei diu exactament quins accidents s'han d'investigar.","La ley dice exactamente qué accidentes deben investigarse."],"ans":false,"exp":["La llei obliga a investigar però no diu quins; ho assenyala l'INSST.","La ley obliga a investigar pero no dice cuáles; lo señala el INSST."]},{"q":["Els accidents s'han de registrar i notificar a l'Administració Laboral.","Los accidentes deben registrarse y notificarse a la Administración Laboral."],"ans":true,"exp":["Per elaborar estadístiques d'accidents.","Para elaborar estadísticas de accidentes."]}],"block":"B3","ra":"RA2"},{"id":"b3-costos","type":"classify","time":["4 min","4 min"],"ce":"g","origin":"complementaria","title":["Per a qui és el cost?","¿Para quién es el coste?"],"cats":[["Empresa","Empresa"],["Treballador i família","Trabajador y familia"],["Societat","Sociedad"]],"items":[{"x":["Danys materials a instal·lacions i equips","Daños materiales en instalaciones y equipos"],"c":0,"exp":["Costos per a l'empresa.","Costes para la empresa."]},{"x":["Pèrdua d'imatge","Pérdida de imagen"],"c":0,"exp":["Costos per a l'empresa.","Costes para la empresa."]},{"x":["Dolor i sofriment per l'accident","Dolor y sufrimiento por el accidente"],"c":1,"exp":["Costos per al treballador.","Costes para el trabajador."]},{"x":["Disminució temporal o definitiva d'ingressos","Disminución temporal o definitiva de ingresos"],"c":1,"exp":["Costos per al treballador.","Costes para el trabajador."]},{"x":["Pagament d'indemnitzacions de la seguretat social","Pago de indemnizaciones de la seguridad social"],"c":2,"exp":["Costos per a la societat.","Costes para la sociedad."]},{"x":["Judicis laborals","Juicios laborales"],"c":2,"exp":["Costos per a la societat.","Costes para la sociedad."]}],"block":"B3","ra":"RA2"},{"id":"b3-ex10","type":"classify","origin":"manual","time":["5 min","5 min"],"ce":"g","title":["Exercici 10. Classifica els costos de l'accident","Ejercicio 10. Clasifica los costes del accidente"],"instr":["Ha ocorregut un accident molt greu en l'empresa amb la mort de 2 treballadors i amb 5 ferits greus. Classifica a quin tipus de cost fa referència cada fet. Els apartats g) i h) tenen dos costos: els trobaràs a la tasca següent.","Ha ocurrido un accidente muy grave en la empresa con la muerte de 2 trabajadores y 5 heridos graves. Clasifica a qué tipo de coste hace referencia cada hecho. Los apartados g) y h) tienen dos costes: los encontrarás en la tarea siguiente."],"cats":[["Empresa","Empresa"],["Treballador i família","Trabajador y familia"]],"items":[{"x":["a) Sanció de 60.000 € i procediment penal contra l'empresa.","a) Sanción de 60.000 € y procedimiento penal contra la empresa."],"c":0,"exp":["Sancions econòmiques i penals.","Sanciones económicas y penales."]},{"x":["b) Els companys i l'encarregat van estar mitja hora socorrent els ferits.","b) Los compañeros y el encargado estuvieron media hora socorriendo a los heridos."],"c":0,"exp":["Temps perduts en auxiliar l'accidentat.","Tiempos perdidos en auxiliar al accidentado."]},{"x":["c) Els treballadors no han continuat treballant la resta del dia.","c) Los trabajadores no han continuado trabajando el resto del día."],"c":0,"exp":["Pèrdua de productivitat.","Pérdida de productividad."]},{"   function reportHTML(d) {

      tb.appendChild(h("thead", null, h("tr", null, h("th", null, t("rAct")), h("th", null, "RA/CE"), h("th", null, t("rType")), h("th", null, t("rRight") + " / " + t("rWrongs")), h("th", null, t("rScore")), h("th", null, t("rPct")), h("th", null, t("rBest")), h("th", null, t("rState")))));

          h("td", null, auto ? h("span", { class: "src-a" }, s.last.sc + "/" + s.last.mx) : (r.fam !== "auto" ? h("span", { class: "src-t" }, s.tGrade ? tagT() + " " + s.tGrade : t("notReviewed")) : "—")),
          h("td", null, auto ? fmtPct(pct(s.last.sc, s.last.mx)) : "—"),
          h("td", null, auto ? s.best.sc + "/" + s.best.mx + " (" + fmtPct(pct(s.best.sc, s.best.mx)) + ") · " + s.attempts + "×" : "—"),
          h("td", null, stateLabel(r))));
        var ans = answersOf(r);
        if (ans.length || s.tComment) {

          if (s.tComment) cell.appendChild(h("div", { class: "ans" }, h("span", { class: "src-t" }, tagT() + " " + t("rTeacherComment") + ": "), s.tComment));
          tbody.appendChild(h("tr", null, cell));

  function reportOverlay() {
    var d = collect();
    var title = t("rTitle") + " — " + (S.student.name || "") + " — " + repLabel();
    var extra = [
      h("button", { type: "button", class: "btn", onclick: printReport }, t("print")),
      h("button", { type: "button", class: "btn ghost", onclick: copyReport }, t("copy")),
      M.mailTo || M.mailEndpoint ? h("button", { type: "button", class: "btn mail", onclick: function () { openOv("mail"); } }, t("mailBtn")) : null];
    return overlayShell("report", title, reportHTML(d), extra);
  }

  /* ---------------- envío por correo ----------------
     meta.mailEndpoint (web app de Google Apps Script del docente): envío directo, sin abrir nada.
     Siempre: Gmail o el programa de correo con destinatario, asunto e informe preparados (el informe se copia antes). */
  function quietCopy(txt) {
    try { if (navigator.clipboard && window.isSecureContext !== false) return navigator.clipboard.writeText(txt).catch(function () { }); } catch (e) { }
    var ta = h("textarea", { style: "position:fixed;left:-9999px" }); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) { } ta.remove(); return Promise.resolve();
  }
  function mailData() {
    var txt = reportPlain(collect());
    var subj = (M.short || "Web") + " · " + repLabel() + " · " + S.student.name.trim() + " (" + S.student.group.trim() + ")";
    return { txt: txt, subj: subj };
  }
  function logMail(how) { S.mails = S.mails || []; S.mails.push({ at: new Date().toISOString(), scope: repLabel(), how: how }); save(true); }
  function mailOverlay() {
    if (!M.mailTo && !M.mailEndpoint) return h("div", { id: "ov-mail", class: "overlay" });
    var box = h("div", { class: "mailbox" });
    box.appendChild(h("p", null, h("b", null, t("mailTo") + ": "), M.mailTo || "—", " · ", h("b", null, t("rScope") + ": "), repLabel()));
    if (M.mailEndpoint) {
      var bd = h("button", { type: "button", class: "btn big", onclick: function () {
        // Formulario en una pestaña nueva: viaja con la sesión de Google del alumnado (scripts limitados al dominio
        // del centro) y la pestaña muestra la respuesta real del script (enviado o inicio de sesión).
        var d = mailData();
        var f = h("form", { method: "POST", action: M.mailEndpoint, target: "_blank", style: "display:none" },
          h("input", { type: "hidden", name: "payload" }));
        f.firstChild.value = JSON.stringify({ key: M.mailKey || "", course: M.short || "", subject: d.subj, name: S.student.name.trim(), group: S.student.group.trim(), scope: repLabel(), lang: S.lang, text: d.txt });
        document.body.appendChild(f); f.submit(); f.remove();
        logMail("directo"); toast(t("mailOpened"));
      } }, t("mailDirect"));
      box.appendChild(h("div", { class: "mail-opt main" }, bd, h("p", { class: "hint" }, t("mailDirectHint"))));
    }
    function compose(kind) {
      var d = mailData(), enc = encodeURIComponent, lim = kind === "gmail" ? 6500 : 1800;
      var body = enc(d.txt).length < lim ? d.txt : t("mailPaste") + "\n\n" + S.student.name + " (" + S.student.group + ") · " + repLabel();
      quietCopy(d.txt).then(function () { toast(t("mailCopied")); });
      logMail(kind);
      var url = kind === "gmail" ? "https://mail.google.com/mail/?view=cm&fs=1&to=" + enc(M.mailTo || "") + "&su=" + enc(d.subj) + "&body=" + enc(body)
        : "mailto:" + (M.mailTo || "") + "?subject=" + enc(d.subj) + "&body=" + enc(body);
      if (kind === "gmail") window.open(url, "_blank", "noopener"); else window.location.href = url;
    }
    if (M.mailTo) box.appendChild(h("div", { class: "mail-opt" },
      h("button", { type: "button", class: M.mailEndpoint ? "btn ghost" : "btn", onclick: function () { compose("gmail"); } }, t("mailGmail")),
      h("button", { type: "button", class: "btn ghost", onclick: function () { compose("app"); } }, t("mailApp"))));
    box.appendChild(h("p", { class: "hint" }, t("mailHint")));
    if (S.mails && S.mails.length) box.appendChild(h("div", null, h("p", null, h("b", null, t("mailLog"))),
      h("ul", { class: "mail-log" }, S.mails.slice(-6).reverse().map(function (m) { return h("li", null, new Date(m.at).toLocaleString(S.lang === "es" ? "es-ES" : "ca-ES") + " · " + m.scope + " · " + m.how); }))));
    return overlayShell("mail", t("mailTitle"), box);
  }
  function validReport() {
    if (!S.student.name.trim() || !S.student.group.trim()) {
      toast(t("needId")); window.scrollTo(0, 0);
      var el = document.getElementById(!S.student.name.trim() ? "st-name" : "st-group");
      if (el) { var dd = el.closest("details"); if (dd) dd.open = true; el.focus(); }
      return false;
    }
    if (collect().doneN === 0 && !window.confirm(t("emptyWarn"))) return false;
    return true;
  }
  function generateReport(scope) {
    REP = scope && scope.k ? scope : null;
    if (validReport()) openOv("report");
  }
  function printReport() {
    var fo = document.getElementById("finalobs"), pv = document.getElementById("finalobs-print");
    if (fo && pv) { pv.textContent = fo.value || "—"; pv.style.display = ""; fo.parentNode.querySelector("textarea").style.display = "none"; }
    document.body.classList.add("print-report");

    window.print();

      document.title = old; document.body.classList.remove("print-report");

    }, 600);
  }
  function copyReport() {
    var txt = reportPlain(collect());
    var fb = document.getElementById("copyfallback");
    function fallback() { fb.style.display = "block"; fb.value = txt; fb.focus(); fb.select(); toast(t("copyFail")); }
    if (navigator.clipboard && window.isSecureContext !== false) {
      navigator.clipboard.writeText(txt).then(function () { toast(t("copied")); }, function () {
        fb.value = txt; fb.style.display = "block"; fb.select();

    } else {
      fb.value = txt; fb.style.display = "block"; fb.select();
      try { if (document.execCommand("copy")) { toast(t("copied")); return; } } catch (e) { }
      fallback();
    }
  }

  // API mínima per a proves automàtiques

  render();
})();
